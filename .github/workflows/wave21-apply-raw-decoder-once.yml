name: Wave21 Apply Raw Victim Decoder Once

on:
  push:
    branches: [gpt/wave21-guest-kernel-oom-victim-provenance]
    paths:
      - .github/workflows/wave21-apply-raw-decoder-once.yml
      - .github/scripts/wave21_apply_raw_decoder.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/wave21-guest-kernel-oom-victim-provenance
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply and verify exact 40-byte raw victim decoder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/wave21_apply_raw_decoder.py
          python3 .github/scripts/wave21_apply_raw_decoder.py
          rustfmt --edition 2021 agent/src/oom_victim_loader.rs

          rustc --edition=2021 --test agent/tests/guest_oom_victim_loader_v21.rs -o /tmp/guest_oom_victim_loader_v21
          /tmp/guest_oom_victim_loader_v21 --nocapture
          rustc --edition=2021 --test agent/tests/guest_oom_victim_bpf_wire_v21.rs -o /tmp/guest_oom_victim_bpf_wire_v21
          /tmp/guest_oom_victim_bpf_wire_v21 --nocapture

          make -C agent MUSL=no SECCOMP=no src/version.rs
          cargo check --locked --manifest-path agent/Cargo.toml
          rm -f agent/src/version.rs
          git diff --check

          unexpected="$(git diff --name-only | grep -Ev '^agent/src/oom_victim_loader\.rs$' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected tracked raw-decoder diff:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Commit verified raw victim decoder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/src/oom_victim_loader.rs
          git diff --cached --check
          git commit -m "feat(wave21): decode exact guest victim records" \
            -m "Autonomously-by: ChatGPT:GPT-5.6-Sol"
          git push origin HEAD:gpt/wave21-guest-kernel-oom-victim-provenance

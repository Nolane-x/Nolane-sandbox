name: Wave19 Apply CubeBox Integration

on:
  push:
    branches:
      - gpt/wave19-host-task-identity-proof
    paths:
      - '.github/workflows/wave19-apply-cubebox-integration.yml'
      - 'Cubelet/services/cubebox/cube_container_create.go'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wave 19 branch
        uses: actions/checkout@v4
        with:
          ref: gpt/wave19-host-task-identity-proof
          fetch-depth: 0

      - name: Apply exact CubeBox integration patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Cubelet/services/cubebox/cube_container_create.go')
          s = p.read_text()
          if 'hostprocess.AddProcAndRecord(' in s:
              print('Wave 19 CubeBox integration already present')
              raise SystemExit(0)

          old_import = '''\tcgroupp "github.com/tencentcloud/CubeSandbox/Cubelet/plugins/cube/internals/cgroup"\n\t"github.com/tencentcloud/CubeSandbox/Cubelet/plugins/cube/internals/cubes"\n\t"github.com/tencentcloud/CubeSandbox/Cubelet/plugins/workflow"'''
          new_import = '''\tcgroupp "github.com/tencentcloud/CubeSandbox/Cubelet/plugins/cube/internals/cgroup"\n\t"github.com/tencentcloud/CubeSandbox/Cubelet/plugins/cube/internals/cubes"\n\t"github.com/tencentcloud/CubeSandbox/Cubelet/plugins/cube/internals/hostprocess"\n\t"github.com/tencentcloud/CubeSandbox/Cubelet/plugins/workflow"'''

          old_call = '''\tif cgSet {\n\t\tgo func() {\n\t\t\tsetCgroup(ctx, pid, cgInfo.CgroupID)\n\t\t\tsanboxlog.Debugf("set cgroup for sandbox success. shim pid: %d", pid)\n\t\t}()\n\t}'''
          new_call = '''\tif cgSet {\n\t\tgo func() {\n\t\t\tif err := hostprocess.AddProcAndRecord(\n\t\t\t\tctx,\n\t\t\t\tsandBox.ID,\n\t\t\t\tcgInfo.CgroupID,\n\t\t\t\tpid,\n\t\t\t\tcgroupp.AddProc,\n\t\t\t\tl.hostProcessPlacementRecorder,\n\t\t\t\ttime.Now,\n\t\t\t); err != nil {\n\t\t\t\tsanboxlog.Errorf("add shim pid %d to cgroup %s failed: %v", pid, cgInfo.CgroupID, err)\n\t\t\t\treturn\n\t\t\t}\n\t\t\tsanboxlog.Debugf("set cgroup for sandbox success. shim pid: %d", pid)\n\t\t}()\n\t}'''

          old_helper = '''func setCgroup(ctx context.Context, pid uint32, group string) {\n\terr := cgroupp.AddProc(group, uint64(pid))\n\tif err != nil {\n\t\tlog.G(ctx).Errorf("add shim pid %d to cgroup %s failed: %v", pid, group, err)\n\t}\n\tlog.G(ctx).Debugf("set cgroup proc success, pid: %d, cgroup: %s", pid, group)\n}\n\n'''

          for label, old in [('import', old_import), ('call', old_call), ('helper', old_helper)]:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label} replacement count={count}, expected exactly 1')
              if label == 'import':
                  s = s.replace(old, new_import, 1)
              elif label == 'call':
                  s = s.replace(old, new_call, 1)
              else:
                  s = s.replace(old, '', 1)

          p.write_text(s)
          PY

          if git diff --quiet -- Cubelet/services/cubebox/cube_container_create.go; then
            exit 0
          fi
          gofmt -w Cubelet/services/cubebox/cube_container_create.go
          git diff --check

      - name: Commit exact integration patch
        shell: bash
        run: |
          if git diff --quiet -- Cubelet/services/cubebox/cube_container_create.go; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cubelet/services/cubebox/cube_container_create.go
          git commit -m 'feat(v19): wire trusted CubeBox placement evidence' -m 'Autonomously-by: ChatGPT:GPT-5.6-Sol'
          git push origin HEAD:gpt/wave19-host-task-identity-proof

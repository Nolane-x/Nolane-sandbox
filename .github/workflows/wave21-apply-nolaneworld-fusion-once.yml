name: Wave21 Apply NolaneWorld Guest Victim Fusion Once

on:
  push:
    branches:
      - gpt/wave21-guest-kernel-oom-victim-provenance

permissions:
  contents: write

concurrency:
  group: wave21-nolaneworld-guest-victim-fusion
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/wave21-guest-kernel-oom-victim-provenance
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: Cubelet/go.mod
          cache: false

      - name: Apply exact same-scrape fusion closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one semantic anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          task = "NolaneWorld/substrate/cube/task_termination.go"
          replace_once(
              task,
              '''type TaskTerminationEvidence struct {
          \tOutcome             TaskOutcomeProof
          \tRealizationOOM      *RealizationOOMProof
          \tHostProcessIdentity *HostSandboxProcessIdentityProof
          \tHostKernelOOMVictim *HostKernelOOMVictimProof
          }''',
              '''type TaskTerminationEvidence struct {
          \tOutcome               TaskOutcomeProof
          \tRealizationOOM        *RealizationOOMProof
          \tHostProcessIdentity   *HostSandboxProcessIdentityProof
          \tHostKernelOOMVictim   *HostKernelOOMVictimProof
          \tGuestKernelOOMVictims []GuestKernelOOMVictimProof
          }''',
              "TaskTerminationEvidence authority field",
          )

          replace_once(
              task,
              '''\tvar victim HostKernelOOMVictimProof
          \toutcomeFound := false
          \toomFound := false
          \tidentityFound := false
          \tvictimFound := false''',
              '''\tvar victim HostKernelOOMVictimProof
          \tvar guestVictims []GuestKernelOOMVictimProof
          \toutcomeFound := false
          \toomFound := false
          \tidentityFound := false
          \tvictimFound := false''',
              "guest victim scan state",
          )

          replace_once(
              task,
              '''\t\t\tvictim = proof
          \t\t\tvictimFound = true
          \t\t}
          \t}''',
              '''\t\t\tvictim = proof
          \t\t\tvictimFound = true

          \t\tcase isGuestKernelOOMVictimMetricToken(fields[0]):
          \t\t\tname, labels, ok := splitMetricToken(fields[0])
          \t\t\tif !ok || name != guestKernelOOMVictimMetric || len(fields) != 2 {
          \t\t\t\treturn TaskTerminationEvidence{}, false, fmt.Errorf("%w: malformed guest kernel OOM victim metric", ErrTaskOutcomeUnavailable)
          \t\t\t}
          \t\t\tmetricSandboxID, hasSandboxID := labels["sandbox_id"]
          \t\t\tif !hasSandboxID || strings.TrimSpace(metricSandboxID) == "" {
          \t\t\t\treturn TaskTerminationEvidence{}, false, fmt.Errorf("%w: guest kernel OOM victim metric has no sandbox identity", ErrTaskOutcomeUnavailable)
          \t\t\t}
          \t\t\tif metricSandboxID != sandboxID {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tproof, err := exactGuestKernelOOMVictimFromSample(labels, fields[1])
          \t\t\tif err != nil {
          \t\t\t\treturn TaskTerminationEvidence{}, false, err
          \t\t\t}
          \t\t\tif len(guestVictims) >= 64 {
          \t\t\t\treturn TaskTerminationEvidence{}, false, fmt.Errorf("%w: guest kernel OOM victim proof set exceeds 64 victims", ErrTaskOutcomeUnavailable)
          \t\t\t}
          \t\t\tif len(guestVictims) > 0 && !sameGuestKernelOOMVictimAuthority(guestVictims[0], proof) {
          \t\t\t\treturn TaskTerminationEvidence{}, false, fmt.Errorf("%w: guest kernel OOM victim proof set mixes realization authority", ErrTaskOutcomeUnavailable)
          \t\t\t}
          \t\t\tfor _, existing := range guestVictims {
          \t\t\t\tif sameGuestKernelOOMVictimProof(existing, proof) {
          \t\t\t\t\treturn TaskTerminationEvidence{}, false, fmt.Errorf("%w: duplicate guest kernel OOM victim proof", ErrTaskOutcomeUnavailable)
          \t\t\t\t}
          \t\t\t}
          \t\t\tguestVictims = append(guestVictims, proof)
          \t\t}
          \t}''',
              "guest victim metric switch",
          )

          replace_once(
              task,
              '''\t\tif victimFound {
          \t\t\treturn TaskTerminationEvidence{}, false, fmt.Errorf("%w: host kernel OOM victim proof has no exact task outcome", ErrTaskOutcomeUnavailable)
          \t\t}
          \t\treturn TaskTerminationEvidence{}, false, nil''',
              '''\t\tif victimFound {
          \t\t\treturn TaskTerminationEvidence{}, false, fmt.Errorf("%w: host kernel OOM victim proof has no exact task outcome", ErrTaskOutcomeUnavailable)
          \t\t}
          \t\tif len(guestVictims) > 0 {
          \t\t\treturn TaskTerminationEvidence{}, false, fmt.Errorf("%w: guest kernel OOM victim proof has no exact task outcome", ErrTaskOutcomeUnavailable)
          \t\t}
          \t\treturn TaskTerminationEvidence{}, false, nil''',
              "detached guest proof rejection",
          )

          replace_once(
              task,
              '''\tif victimFound {
          \t\tif evidence.HostProcessIdentity == nil {
          \t\t\treturn TaskTerminationEvidence{}, false, fmt.Errorf("%w: host kernel OOM victim proof has no exact host process identity", ErrTaskOutcomeUnavailable)
          \t\t}
          \t\tif err := correlateHostKernelOOMVictim(outcome, evidence.RealizationOOM, *evidence.HostProcessIdentity, victim); err != nil {
          \t\t\treturn TaskTerminationEvidence{}, false, err
          \t\t}
          \t\tproof := victim
          \t\tevidence.HostKernelOOMVictim = &proof
          \t}
          \treturn evidence, true, nil''',
              '''\tif victimFound {
          \t\tif evidence.HostProcessIdentity == nil {
          \t\t\treturn TaskTerminationEvidence{}, false, fmt.Errorf("%w: host kernel OOM victim proof has no exact host process identity", ErrTaskOutcomeUnavailable)
          \t\t}
          \t\tif err := correlateHostKernelOOMVictim(outcome, evidence.RealizationOOM, *evidence.HostProcessIdentity, victim); err != nil {
          \t\t\treturn TaskTerminationEvidence{}, false, err
          \t\t}
          \t\tproof := victim
          \t\tevidence.HostKernelOOMVictim = &proof
          \t}
          \tfor _, guestVictim := range guestVictims {
          \t\tif err := correlateGuestKernelOOMVictim(outcome, guestVictim); err != nil {
          \t\t\treturn TaskTerminationEvidence{}, false, err
          \t\t}
          \t}
          \tevidence.GuestKernelOOMVictims = append([]GuestKernelOOMVictimProof(nil), guestVictims...)
          \treturn evidence, true, nil''',
              "same-scrape guest proof fusion",
          )

          replace_once(
              "Cubelet/plugins/cube/internals/resourcemetrics/guest_kernel_oom_victim_prometheus.go",
              '''\tcase "main":
          \t\treturn victimTGID == mainPID && victimStarttimeTicks == mainStarttimeTicks && cgroupV2ID == 0''',
              '''\tcase "main":
          \t\treturn victimTGID == mainPID && victimStarttimeTicks == mainStarttimeTicks''',
              "MAIN optional cgroup provenance",
          )
          PY

          gofmt -w \
            NolaneWorld/substrate/cube/task_termination.go \
            NolaneWorld/substrate/cube/task_termination_guest_victim.go \
            NolaneWorld/substrate/cube/guest_kernel_oom_victim.go \
            NolaneWorld/substrate/cube/guest_kernel_oom_victim_v21_test.go \
            NolaneWorld/substrate/cube/guest_kernel_oom_victim_authority_v21_test.go \
            NolaneWorld/substrate/cube/task_termination_guest_victim_v21_test.go \
            Cubelet/plugins/cube/internals/resourcemetrics/guest_kernel_oom_victim_prometheus.go \
            Cubelet/plugins/cube/internals/resourcemetrics/guest_kernel_oom_victim_v21_test.go \
            Cubelet/plugins/cube/internals/resourcemetrics/guest_kernel_oom_victim_authority_v21_test.go \
            Cubelet/plugins/cube/internals/resourcemetrics/guest_kernel_oom_victim_main_cgroup_v21_test.go \
            Cubelet/plugins/cube/internals/resourcemetrics/guest_kernel_oom_victim_plugin_v21_test.go \
            Cubelet/plugins/cube/internals/sandbox/guest_oom_victim_authority_visit.go

          (cd NolaneWorld && go test ./substrate/cube -run 'TestV21|TestTaskTermination' -count=1)
          (cd Cubelet && go test ./plugins/cube/internals/resourcemetrics ./plugins/cube/internals/sandbox -run 'TestV21' -count=1)
          git diff --check

      - name: Commit verified closure
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/wave21-apply-nolaneworld-fusion-once.yml
          git add \
            NolaneWorld/substrate/cube/task_termination.go \
            NolaneWorld/substrate/cube/task_termination_guest_victim.go \
            NolaneWorld/substrate/cube/guest_kernel_oom_victim.go \
            NolaneWorld/substrate/cube/guest_kernel_oom_victim_v21_test.go \
            NolaneWorld/substrate/cube/guest_kernel_oom_victim_authority_v21_test.go \
            NolaneWorld/substrate/cube/task_termination_guest_victim_v21_test.go \
            Cubelet/plugins/cube/internals/resourcemetrics/guest_kernel_oom_victim_prometheus.go \
            Cubelet/plugins/cube/internals/resourcemetrics/guest_kernel_oom_victim_v21_test.go \
            Cubelet/plugins/cube/internals/resourcemetrics/guest_kernel_oom_victim_authority_v21_test.go \
            Cubelet/plugins/cube/internals/resourcemetrics/guest_kernel_oom_victim_main_cgroup_v21_test.go \
            Cubelet/plugins/cube/internals/resourcemetrics/guest_kernel_oom_victim_plugin_v21_test.go \
            Cubelet/plugins/cube/internals/sandbox/guest_oom_victim_authority_visit.go
          git diff --cached --check
          git config user.name "Nolane-x"
          git config user.email "casioreview20@gmail.com"
          git commit -m "feat(wave21): fuse exact guest victim evidence" -m "Verified same-scrape Wave17 correlation and full 15-field guest-kernel victim authority transport." -m "Autonomously-by: ChatGPT:GPT-5.6-Sol"
          git push origin HEAD:gpt/wave21-guest-kernel-oom-victim-provenance

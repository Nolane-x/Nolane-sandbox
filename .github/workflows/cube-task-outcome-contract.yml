name: Cube Task Outcome Contract

on:
  pull_request:
    paths:
      - 'Cubelet/plugins/cube/internals/sandbox/**'
      - 'Cubelet/plugins/cube/internals/resourcemetrics/**'
      - 'Cubelet/go.mod'
      - 'Cubelet/go.sum'
      - 'NolaneWorld/substrate/cube/**'
      - 'NolaneWorld/go.mod'
      - 'docs/superpowers/specs/**exact-task-outcome-transport-v17**'
      - 'docs/superpowers/plans/**exact-task-outcome-transport-v17**'
      - '.github/workflows/cube-task-outcome-contract.yml'
  push:
    branches: [master]
    paths:
      - 'Cubelet/plugins/cube/internals/sandbox/**'
      - 'Cubelet/plugins/cube/internals/resourcemetrics/**'
      - 'Cubelet/go.mod'
      - 'Cubelet/go.sum'
      - 'NolaneWorld/substrate/cube/**'
      - 'NolaneWorld/go.mod'
      - 'docs/superpowers/specs/**exact-task-outcome-transport-v17**'
      - 'docs/superpowers/plans/**exact-task-outcome-transport-v17**'
      - '.github/workflows/cube-task-outcome-contract.yml'

permissions:
  contents: read

concurrency:
  group: cube-task-outcome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-task-outcome-proof:
    name: Exact task outcome proof and transport
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: Cubelet/go.mod
          cache: true
          cache-dependency-path: |
            Cubelet/go.sum
            NolaneWorld/go.mod

      - name: Verify Cubelet exact proof and transport contract
        working-directory: Cubelet
        run: go test ./plugins/cube/internals/sandbox ./plugins/cube/internals/resourcemetrics -run 'TaskOutcome|OutcomeCandidate' -count=1

      - name: Verify NolaneWorld exact consumer contract
        working-directory: NolaneWorld
        run: go test ./substrate/cube -run 'TaskOutcome' -count=1

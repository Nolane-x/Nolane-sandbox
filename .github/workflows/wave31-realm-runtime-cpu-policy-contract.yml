name: Wave31 Realm Runtime CPU Policy Contract

on:
  push:
    branches:
      - gpt/wave31-realm-physical-cpu-policy-authority
  pull_request:
    paths:
      - 'NolaneWorld/realm/model.go'
      - 'NolaneWorld/realm/runtime_cpu_policy_authority.go'
      - 'NolaneWorld/realm/runtime_cpu_policy_authority_v31_test.go'
      - 'NolaneWorld/realm/runtime_cpu_policy_authority_external_v31_test.go'
      - 'NolaneWorld/realm/runtime_cpu_policy_authority_v31_review_test.go'
      - 'tests/wave31_realm_runtime_cpu_policy_contract.py'
      - '.github/workflows/wave31-realm-runtime-cpu-policy-contract.yml'
      - 'docs/superpowers/specs/2026-09-09-realm-runtime-cpu-policy-authority-v31-design.md'
      - 'docs/superpowers/plans/2026-09-09-realm-runtime-cpu-policy-authority-v31.md'
      - 'docs/superpowers/verification/2026-09-09-wave31-realm-runtime-cpu-policy-red.md'
      - 'docs/superpowers/verification/2026-09-09-wave31-realm-runtime-cpu-policy-closure.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: NolaneWorld/go.sum
      - name: Focused Wave31 tests
        working-directory: NolaneWorld
        run: go test ./realm -run 'V31|RuntimeCPUPolicy' -count=1
      - name: Static Wave31 contract
        run: python -m pytest -q tests/wave31_realm_runtime_cpu_policy_contract.py
      - name: Prior Realm authority regression
        working-directory: NolaneWorld
        run: go test ./realm -run 'V23|V31|RealizationAuthority|PolicyDigest' -count=1
      - name: Vet NolaneWorld
        working-directory: NolaneWorld
        run: go vet ./...
      - name: Test NolaneWorld
        working-directory: NolaneWorld
        run: go test ./... -count=1
      - name: Race focused Wave31
        working-directory: NolaneWorld
        run: go test -race ./realm -run 'V31|RuntimeCPUPolicy' -count=1

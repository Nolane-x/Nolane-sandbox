name: Wave25 Provider Green Helper

on:
  push:
    branches:
      - gpt/wave25-provider-incarnation-authority
    paths:
      - .github/workflows/wave25-provider-green-helper.yml

permissions:
  contents: write

jobs:
  verify-provider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/wave25-provider-incarnation-authority
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: NolaneWorld/go.mod

      - name: Focused Wave25 provider proof tests
        working-directory: NolaneWorld
        run: go test ./substrate/cube -run 'V25.*ProviderIncarnation' -count=1

      - name: Vet Cube trust package
        working-directory: NolaneWorld
        run: go vet ./substrate/cube

      - name: Remove helper after GREEN
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/wave25-provider-green-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m $'ci(wave25): record provider proof green\n\nAutonomously-by: ChatGPT:GPT-5.6-Sol'
          git push origin HEAD:gpt/wave25-provider-incarnation-authority

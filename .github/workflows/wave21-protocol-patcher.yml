name: Wave21 Protocol Generation

on:
  push:
    branches:
      - gpt/wave21-guest-kernel-oom-victim-provenance

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/wave21_apply_protocol.py
      - run: cargo build --manifest-path CubeShim/protoc/Cargo.toml
      - run: python3 tests/wave21_protocol_contract.py
      - run: git diff --check
      - name: Commit generated protocol
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/wave21-protocol-patcher.yml scripts/wave21_apply_protocol.py
          git add agent/libs/protocols/protos/agent.proto CubeShim/protoc/protos/agent.proto CubeShim/protoc/src/agent.rs CubeShim/protoc/src/agent_ttrpc.rs
          git commit -m "feat(v21): synchronize guest victim protocol" -m "Autonomously-by: ChatGPT:GPT-5.6-Sol"
          git push origin HEAD:gpt/wave21-guest-kernel-oom-victim-provenance

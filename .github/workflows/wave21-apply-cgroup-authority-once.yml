name: Wave21 Apply Guest Cgroup Authority Once
# One-shot worker: apply the reviewed Wave21 cgroup authority patcher and
# verify the real guest build/contracts. Transport cleanup is performed by
# the repository controller after the production commit lands, so the
# Actions token never needs workflows permission.

on:
  push:
    branches: [gpt/wave21-guest-kernel-oom-victim-provenance]
    paths:
      - .github/workflows/wave21-apply-cgroup-authority-once.yml
      - .github/scripts/wave21_apply_cgroup_authority.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/wave21-guest-kernel-oom-victim-provenance
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply and verify exact cgroup-v2 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/wave21_apply_cgroup_authority.py
          python3 .github/scripts/wave21_apply_cgroup_authority.py

          rustfmt --edition 2021 \
            agent/src/guest_oom_victim.rs \
            agent/src/oom_victim_loader.rs \
            agent/src/rpc.rs \
            agent/tests/guest_oom_victim_cgroup_v21.rs

          rustc --edition=2021 --test agent/tests/guest_oom_victim_cgroup_v21.rs -o /tmp/guest_oom_victim_cgroup_v21
          /tmp/guest_oom_victim_cgroup_v21 --nocapture
          rustc --edition=2021 --test agent/tests/guest_oom_victim_loader_v21.rs -o /tmp/guest_oom_victim_loader_v21
          /tmp/guest_oom_victim_loader_v21 --nocapture
          python3 tests/wave21_agent_service_contract.py

          # Generate the canonical metadata-only source without engaging the
          # MUSL/seccomp release-link prerequisites that are irrelevant to check.
          make -C agent MUSL=no SECCOMP=no src/version.rs
          cargo check --locked --manifest-path agent/Cargo.toml
          rm -f agent/src/version.rs

          git diff --check

      - name: Commit verified cgroup authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            agent/src/guest_oom_victim.rs \
            agent/src/oom_victim_loader.rs \
            agent/src/rpc.rs \
            agent/tests/guest_oom_victim_cgroup_v21.rs \
            tests/wave21_agent_service_contract.py
          git diff --cached --check
          git commit -m "feat(wave21): capture exact guest cgroup-v2 identity" \
            -m "Autonomously-by: ChatGPT:GPT-5.6-Sol"
          git push origin HEAD:gpt/wave21-guest-kernel-oom-victim-provenance

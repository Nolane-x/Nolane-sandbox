name: Wave21 Apply Guest Cgroup Authority Once
# One-shot worker: close the exact guest cgroup-v2 authority seam from the
# already-RED Wave21 contract, verify the real agent build, then self-delete.

on:
  push:
    branches: [gpt/wave21-guest-kernel-oom-victim-provenance]
    paths:
      - .github/workflows/wave21-apply-cgroup-authority-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/wave21-guest-kernel-oom-victim-provenance
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply exact cgroup-v2 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          authority = Path("agent/src/guest_oom_victim.rs")
          text = authority.read_text()
          marker = "#[repr(C)]\nstruct KernelTimespec {"
          helper = b64decode("").decode()
          if "pub fn read_process_cgroup_v2_id" not in text:
              if marker not in text:
                  raise SystemExit("guest authority insertion anchor missing")
              text = text.replace(marker, helper + "\n\n" + marker, 1)
              authority.write_text(text)

          loader = Path("agent/src/oom_victim_loader.rs")
          text = loader.read_text()
          replacements = [
              (
                  "let actual_encoding = match ty.payload {\n            BtfPayload::Int { encoding } => encoding,",
                  "let actual_encoding = match &ty.payload {\n            BtfPayload::Int { encoding } => *encoding,",
              ),
              (
                  "matches!(id_type.payload, BtfPayload::Int { encoding: 0 })",
                  "matches!(&id_type.payload, BtfPayload::Int { encoding: 0 })",
              ),
              (
                  "matches!(inner_type.payload, BtfPayload::Int { encoding: 0 })",
                  "matches!(&inner_type.payload, BtfPayload::Int { encoding: 0 })",
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
          loader.write_text(text)

          rpc = Path("agent/src/rpc.rs")
          text = rpc.read_text()
          old_import = (
              "current_boottime_ns, read_guest_boot_id, read_process_identity, "
              "RealizationToken, VictimClass,"
          )
          new_import = (
              "current_boottime_ns, read_guest_boot_id, read_process_cgroup_v2_id, "
              "read_process_identity, RealizationToken, VictimClass,"
          )
          if "read_process_cgroup_v2_id" not in text:
              if old_import not in text:
                  raise SystemExit("rpc Wave21 import anchor missing")
              text = text.replace(old_import, new_import, 1)

          old_begin = b64decode("").decode()
          new_begin = b64decode("").decode()
          if "let expected_cgroup_v2_id = match read_process_cgroup_v2_id" not in text:
              if old_begin not in text:
                  raise SystemExit("rpc begin-realization anchor missing")
              text = text.replace(old_begin, new_begin, 1)
          rpc.write_text(text)

          contract = Path("tests/wave21_agent_service_contract.py")
          text = contract.read_text()
          marker = '    "begin_guest_oom_victim_realization",\n'
          addition = '    "read_process_cgroup_v2_id",\n'
          if addition not in text:
              if marker not in text:
                  raise SystemExit("agent contract anchor missing")
              text = text.replace(marker, marker + addition, 1)
              contract.write_text(text)

          contract_workflow = Path(".github/workflows/cube-guest-kernel-oom-victim-contract.yml")
          text = contract_workflow.read_text()
          cgroup_test = (
              "          rustc --edition=2021 --test tests/guest_oom_victim_cgroup_v21.rs "
              "-o /tmp/guest_oom_victim_cgroup_v21\n"
              "          /tmp/guest_oom_victim_cgroup_v21 --nocapture\n"
          )
          if "rustc --edition=2021 --test tests/guest_oom_victim_cgroup_v21.rs" not in text:
              anchor = (
                  "          rustc --edition=2021 --test tests/guest_oom_victim_bounds_v21.rs "
                  "-o /tmp/guest_oom_victim_bounds_v21\n"
                  "          /tmp/guest_oom_victim_bounds_v21 --nocapture\n"
              )
              if anchor not in text:
                  raise SystemExit("Wave21 guest contract bounds anchor missing")
              text = text.replace(anchor, anchor + cgroup_test, 1)
              contract_workflow.write_text(text)
          PY

          rustfmt --edition 2021 \
            agent/src/guest_oom_victim.rs \
            agent/src/oom_victim_loader.rs \
            agent/src/rpc.rs \
            agent/tests/guest_oom_victim_cgroup_v21.rs

          rustc --edition=2021 --test agent/tests/guest_oom_victim_cgroup_v21.rs -o /tmp/guest_oom_victim_cgroup_v21
          /tmp/guest_oom_victim_cgroup_v21 --nocapture
          rustc --edition=2021 --test agent/tests/guest_oom_victim_loader_v21.rs -o /tmp/guest_oom_victim_loader_v21
          /tmp/guest_oom_victim_loader_v21 --nocapture
          python3 tests/wave21_agent_service_contract.py
          cargo check --locked --manifest-path agent/Cargo.toml
          git diff --check

          git rm .github/workflows/wave21-apply-cgroup-authority-once.yml

      - name: Commit verified cgroup authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(wave21): capture exact guest cgroup-v2 identity" \
            -m "Autonomously-by: ChatGPT:GPT-5.6-Sol"
          git push origin HEAD:gpt/wave21-guest-kernel-oom-victim-provenance

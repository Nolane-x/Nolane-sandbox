name: Wave21 Close Agent Wiring Once
on:
  push:
    branches: [gpt/wave21-guest-kernel-oom-victim-provenance]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/wave21-guest-kernel-oom-victim-provenance
          fetch-depth: 0
      - name: Apply reviewed guest authority wiring
        shell: bash
        run: |
          set -euo pipefail
          git show 30eef67af6c74994383457be134d56fc1993ac34:.github/workflows/wave21-apply-agent-wiring-once.yml > /tmp/original-wave21-agent.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/original-wave21-agent.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply-wave21-agent.py').write_text(script)
          PY
          python3 /tmp/apply-wave21-agent.py
          # main.rs only gains `mod guest_oom_victim;`. Standalone rustfmt of
          # the crate root tries to resolve build-generated src/version.rs.
          rustfmt --edition 2021 agent/src/guest_oom_victim.rs agent/src/sandbox.rs agent/src/rpc.rs
          python3 tests/wave21_agent_service_contract.py
          git diff --check
      - name: Verify guest unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd agent
          make test
      - name: Commit guest wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/src/main.rs agent/src/guest_oom_victim.rs agent/src/sandbox.rs agent/src/rpc.rs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(v21): wire finalized guest victim authority into agent" -m "Autonomously-by: ChatGPT:GPT-5.6-Sol"
          git push origin HEAD:gpt/wave21-guest-kernel-oom-victim-provenance

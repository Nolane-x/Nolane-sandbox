name: Cube Realization OOM Contract

on:
  pull_request:
    paths:
      - 'Cubelet/plugins/cube/internals/sandbox/**'
      - 'Cubelet/plugins/cube/internals/resourcemetrics/**'
      - 'Cubelet/plugins/cube/internals/cgroup/**'
      - 'Cubelet/pkg/store/cubebox/**'
      - 'Cubelet/go.mod'
      - 'Cubelet/go.sum'
      - 'NolaneWorld/substrate/cube/**'
      - 'NolaneWorld/go.mod'
      - 'docs/superpowers/specs/**realization-oom-proof-v18**'
      - 'docs/superpowers/plans/**realization-oom-proof-v18**'
      - '.github/workflows/cube-realization-oom-contract.yml'
  push:
    branches: [master]
    paths:
      - 'Cubelet/plugins/cube/internals/sandbox/**'
      - 'Cubelet/plugins/cube/internals/resourcemetrics/**'
      - 'Cubelet/plugins/cube/internals/cgroup/**'
      - 'Cubelet/pkg/store/cubebox/**'
      - 'Cubelet/go.mod'
      - 'Cubelet/go.sum'
      - 'NolaneWorld/substrate/cube/**'
      - 'NolaneWorld/go.mod'
      - 'docs/superpowers/specs/**realization-oom-proof-v18**'
      - 'docs/superpowers/plans/**realization-oom-proof-v18**'
      - '.github/workflows/cube-realization-oom-contract.yml'

permissions:
  contents: read

concurrency:
  group: cube-realization-oom-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  realization-oom-proof:
    name: Realization-scoped kernel OOM evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Cubelet/go.mod
          cache: true
          cache-dependency-path: |
            Cubelet/go.sum
            NolaneWorld/go.mod

      - name: Verify Cubelet realization OOM contract
        working-directory: Cubelet
        run: go test ./plugins/cube/internals/sandbox ./plugins/cube/internals/resourcemetrics -run 'RealizationOOM|TaskTermination' -count=1

      - name: Verify NolaneWorld realization OOM contract
        working-directory: NolaneWorld
        run: go test ./substrate/cube -run 'RealizationOOM|TaskTermination' -count=1

name: Wave21 Apply Shim Wiring Once V2
on:
  push:
    branches: [gpt/wave21-guest-kernel-oom-victim-provenance]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/wave21-guest-kernel-oom-victim-provenance
          fetch-depth: 0
      - name: Apply verified Wave21 production wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); text=p.read_text(); n=text.count(old)
              if n != 1: raise SystemExit(f"{path}: expected one anchor, got {n}: {old[:100]!r}")
              p.write_text(text.replace(old,new,1))

          p="CubeShim/shim/src/lib.rs"
          if "pub mod guest_victim;" not in Path(p).read_text():
              r(p,"pub mod cube;\npub mod hypervisor;","pub mod cube;\npub mod guest_victim;\npub mod hypervisor;")

          p="CubeShim/shim/src/container/mod.rs"
          if "pub async fn start_container_with_oom_victim" not in Path(p).read_text():
              r(p,"    pub async fn start_container(&mut self) -> CResult<()> {\n        if !self.passfd_io_enabled() {","    pub async fn start_container(&mut self) -> CResult<()> {\n        self.start_container_with_oom_victim(None).await\n    }\n\n    pub async fn start_container_with_oom_victim(\n        &mut self,\n        oom_victim_realization_token: Option<&[u8; 32]>,\n    ) -> CResult<()> {\n        if !self.passfd_io_enabled() {")
              r(p,"            let req = agent::StartContainerRequest {\n                container_id: self.id.clone(),\n                ..Default::default()\n            };","            let req = agent::StartContainerRequest {\n                container_id: self.id.clone(),\n                oom_victim_realization_token: oom_victim_realization_token.map(|token| token.to_vec()).unwrap_or_default(),\n                ..Default::default()\n            };")

          p="CubeShim/shim/src/sandbox/sb.rs"
          if "pub async fn start_container_with_oom_victim" not in Path(p).read_text():
              r(p,"use crate::hypervisor::snapshot::{enable_snapshot, SnapshotInfo};\nuse crate::log::{stat_defer, Log};","use crate::guest_victim::RealizationToken;\nuse crate::hypervisor::snapshot::{enable_snapshot, SnapshotInfo};\nuse crate::log::{stat_defer, Log};")
              r(p,"    pub async fn start_container(&mut self, id: &String) -> Result<()> {\n        let mut containers = self.containers.lock().await;\n        let container = match containers.get_mut(id) {\n            Some(c) => c,\n            None => return Err(Error::NotFoundError(format!(\"not found container:{}\", id))),\n        };\n        container\n            .start_container()\n            .await\n            .map_err(|e| Error::Other(e.to_string()))?;\n        Ok(())\n    }","    pub async fn start_container(&mut self, id: &String) -> Result<()> {\n        self.start_container_with_oom_victim(id, None).await\n    }\n\n    pub async fn start_container_with_oom_victim(&mut self, id: &String, token: Option<RealizationToken>) -> Result<()> {\n        let mut containers = self.containers.lock().await;\n        let container = match containers.get_mut(id) {\n            Some(c) => c,\n            None => return Err(Error::NotFoundError(format!(\"not found container:{}\", id))),\n        };\n        container.start_container_with_oom_victim(token.as_ref().map(RealizationToken::as_bytes)).await.map_err(|e| Error::Other(e.to_string()))?;\n        Ok(())\n    }")
              r(p,"    pub async fn wait_container(&self, id: &String, exec_id: &str) -> Result<(u32, DateTime<Utc>)> {","    pub async fn get_oom_victim_evidence(&self, id: &str, token: &[u8; 32]) -> Result<Vec<u8>> {\n        use protobuf::Message;\n        let guest_container_id = self.guest_container_id(id).await?;\n        let client = self.client.as_ref().ok_or_else(|| Error::Other(\"guest agent is not connected\".to_string()))?.lock().await;\n        let req = agent::GetOOMVictimEvidenceRequest { container_id: guest_container_id, realization_token: token.to_vec(), ..Default::default() };\n        let response = client.get_oom_victim_evidence(self.ctx.clone(), &req).await.map_err(|e| Error::Other(format!(\"GetOOMVictimEvidence failed for {}: {}\", id, e)))?;\n        response.write_to_bytes().map_err(|e| Error::Other(format!(\"encode OOM victim evidence failed for {}: {}\", id, e)))\n    }\n\n    pub async fn wait_container(&self, id: &String, exec_id: &str) -> Result<(u32, DateTime<Utc>)> {")

          p="CubeShim/shim/src/service/task_srv.rs"
          if "victim_bindings: Arc<Mutex<TokenBindings>>" not in Path(p).read_text():
              r(p,"use std::sync::Arc;","use std::collections::HashMap;\nuse std::sync::Arc;")
              r(p,"use crate::container::{container_mgr::ContainerInfo, exec::Tty};\nuse crate::log::{stat_defer, Log, LogLevel};","use crate::container::{container_mgr::ContainerInfo, exec::Tty};\nuse crate::guest_victim::{EvidenceCache, RealizationToken, TokenBindings, EVIDENCE_METADATA_KEY, EVIDENCE_TYPE_URL};\nuse crate::guest_victim::parse_bind_annotations;\nuse crate::log::{stat_defer, Log, LogLevel};")
              r(p,"    exit: Arc<ExitSignal>,\n    tx_containerd: Sender<(String, Box<dyn MessageDyn>)>,","    exit: Arc<ExitSignal>,\n    tx_containerd: Sender<(String, Box<dyn MessageDyn>)>,\n    victim_bindings: Arc<Mutex<TokenBindings>>,\n    victim_active: Arc<Mutex<HashMap<String, RealizationToken>>>,\n    victim_evidence: Arc<Mutex<EvidenceCache>>,")
              r(p,"            exit,\n            tx_containerd: tx,\n        }","            exit,\n            tx_containerd: tx,\n            victim_bindings: Arc::new(Mutex::new(TokenBindings::default())),\n            victim_active: Arc::new(Mutex::new(HashMap::new())),\n            victim_evidence: Arc::new(Mutex::new(EvidenceCache::default())),\n        }")
              r(p,"        infof!(self.log, \"create req start\");\n        let start = Instant::now();","        infof!(self.log, \"create req start\");\n        self.victim_bindings.lock().await.clear(&req.id);\n        self.victim_active.lock().await.remove(&req.id);\n        self.victim_evidence.lock().await.clear(&req.id);\n        let start = Instant::now();")
              r(p,"        let mut sb = self.sandbox.lock().await;\n        if sb.paused().await {\n            errf!(self.log, \"sandbox not in normal state\");\n            return Err(Others(format!(\"sandbox not in normal state\")));\n        }\n        if req.exec_id().is_empty() {\n            sb.start_container(&req.id).await.map_err(|e| {","        let victim_token = if req.exec_id().is_empty() { self.victim_bindings.lock().await.consume_main(&req.id) } else { None };\n        let mut sb = self.sandbox.lock().await;\n        if sb.paused().await {\n            errf!(self.log, \"sandbox not in normal state\");\n            return Err(Others(format!(\"sandbox not in normal state\")));\n        }\n        if req.exec_id().is_empty() {\n            sb.start_container_with_oom_victim(&req.id, victim_token).await.map_err(|e| {")
              r(p,"            })?;\n\n            let event = TaskStart {","            })?;\n            if let Some(token) = victim_token { self.victim_active.lock().await.insert(req.id.clone(), token); }\n\n            let event = TaskStart {")
              r(p,"        let e_tm: protobuf::well_known_types::timestamp::Timestamp =","        if req.exec_id().is_empty() {\n            if let Some(token) = self.victim_active.lock().await.remove(&req.id) {\n                match sb.get_oom_victim_evidence(&req.id, token.as_bytes()).await {\n                    Ok(payload) if !payload.is_empty() => { if let Err(e) = self.victim_evidence.lock().await.insert_finalized(&req.id, token, payload) { warnf!(self.log, \"cache Wave21 evidence failed for {}: {}\", req.id, e); } },\n                    Ok(_) => warnf!(self.log, \"guest returned empty Wave21 evidence for {}\", req.id),\n                    Err(e) => warnf!(self.log, \"guest Wave21 evidence unavailable for {}: {}\", req.id, e),\n                }\n            }\n        }\n        let e_tm: protobuf::well_known_types::timestamp::Timestamp =")
              r(p,"    async fn stats(\n        &self,\n        _ctx: &TtrpcContext,\n        req: api::StatsRequest,\n    ) -> TtrpcResult<api::StatsResponse> {\n        if req.id.is_empty() {\n            return Err(Error::InvalidArgument(\"stats request id is empty\".to_string()).into());\n        }\n\n        let sb = {","    async fn stats(\n        &self,\n        ctx: &TtrpcContext,\n        req: api::StatsRequest,\n    ) -> TtrpcResult<api::StatsResponse> {\n        if req.id.is_empty() { return Err(Error::InvalidArgument(\"stats request id is empty\".to_string()).into()); }\n        if let Some(values) = ctx.metadata.get(EVIDENCE_METADATA_KEY) {\n            if values.len() != 1 { return Err(Error::InvalidArgument(\"Wave21 evidence selector must have exactly one value\".to_string()).into()); }\n            let mut metadata = HashMap::new(); metadata.insert(EVIDENCE_METADATA_KEY.to_string(), values[0].clone());\n            let selected = self.victim_evidence.lock().await.select(&req.id, &metadata).map_err(|e| Error::InvalidArgument(e.to_string()))?;\n            let payload = selected.ok_or_else(|| Error::FailedPreconditionError(\"Wave21 finalized evidence is unavailable for exact realization token\".to_string()))?;\n            let stats = protobuf::well_known_types::any::Any { type_url: EVIDENCE_TYPE_URL.to_string(), value: payload, ..Default::default() };\n            return Ok(api::StatsResponse { stats: Some(stats).into(), ..Default::default() });\n        }\n\n        let sb = {")
              r(p,"        let mut stat = stat_defer::StatDefer::new(\n            req.id.clone(),\n            stat_defer::CALLEE_SHIM.to_string(),\n            stat_defer::ACT_DELETE.to_string(),","        if req.exec_id().is_empty() {\n            self.victim_bindings.lock().await.clear(&req.id);\n            self.victim_active.lock().await.remove(&req.id);\n            self.victim_evidence.lock().await.clear(&req.id);\n        }\n        let mut stat = stat_defer::StatDefer::new(\n            req.id.clone(),\n            stat_defer::CALLEE_SHIM.to_string(),\n            stat_defer::ACT_DELETE.to_string(),")
              r(p,"        infof!(self.log, \"update req start, id:{}\", &req.id);\n        let outcome = {","        infof!(self.log, \"update req start, id:{}\", &req.id);\n        if let Some(token) = parse_bind_annotations(&req.annotations).map_err(|e| Error::InvalidArgument(e.to_string()))? {\n            self.victim_bindings.lock().await.bind(&req.id, token).map_err(|e| Error::FailedPreconditionError(e.to_string()))?;\n            return Ok(api::Empty::default());\n        }\n        let outcome = {")
              r(p,"        infof!(self.log, \"shutdown req start\");\n\n        let mut sb = self.sandbox.lock().await;","        infof!(self.log, \"shutdown req start\");\n        self.victim_bindings.lock().await.clear_all();\n        self.victim_active.lock().await.clear();\n        self.victim_evidence.lock().await.clear_all();\n\n        let mut sb = self.sandbox.lock().await;")
          print("applied")
          PY
          cargo fmt --manifest-path CubeShim/Cargo.toml --all
          git diff --check
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CubeShim/shim/src/lib.rs CubeShim/shim/src/container/mod.rs CubeShim/shim/src/sandbox/sb.rs CubeShim/shim/src/service/task_srv.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(v21): wire exact guest victim evidence through shim" -m "Autonomously-by: ChatGPT:GPT-5.6-Sol"
          git push origin HEAD:gpt/wave21-guest-kernel-oom-victim-provenance

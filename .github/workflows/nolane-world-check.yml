name: Nolane World Check

on:
  pull_request:
    paths:
      - 'NolaneWorld/**'
      - 'docs/superpowers/specs/**nolane-sandbox**'
      - 'docs/superpowers/plans/**nolane-sandbox**'
      - '.github/workflows/nolane-world-check.yml'
  push:
    branches: [master]
    paths:
      - 'NolaneWorld/**'
      - '.github/workflows/nolane-world-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nolane-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trust-kernel:
    name: Trust Kernel contract suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: NolaneWorld/go.mod

      - name: Unit tests
        working-directory: NolaneWorld
        run: go test ./...

      - name: Race tests
        working-directory: NolaneWorld
        run: go test -race ./...

      - name: Vet
        working-directory: NolaneWorld
        run: go vet ./...

      - name: Generate Release Gauntlet evidence
        working-directory: NolaneWorld
        run: |
          go run ./cmd/nolane-gauntlet --out release-evidence/nolane-gauntlet-v4.json
          go run ./cmd/nolane-gauntlet --out release-evidence/nolane-gauntlet-v4-repeat.json
          cmp release-evidence/nolane-gauntlet-v4.json release-evidence/nolane-gauntlet-v4-repeat.json
          rm release-evidence/nolane-gauntlet-v4-repeat.json

      - name: Generate Delegated Authority evidence
        working-directory: NolaneWorld
        run: |
          go run ./cmd/nolane-authority-gauntlet --out release-evidence/nolane-authority-v6.json
          go run ./cmd/nolane-authority-gauntlet --out release-evidence/nolane-authority-v6-repeat.json
          cmp release-evidence/nolane-authority-v6.json release-evidence/nolane-authority-v6-repeat.json
          if grep -Fq 'SYNTHETIC-V6-SECRET' release-evidence/nolane-authority-v6.json; then
            echo 'synthetic credential leaked into v6 evidence' >&2
            exit 1
          fi
          rm release-evidence/nolane-authority-v6-repeat.json

      - name: Generate Provider Authority evidence
        working-directory: NolaneWorld
        run: |
          go run ./cmd/nolane-provider-gauntlet --out release-evidence/nolane-provider-v7.json
          go run ./cmd/nolane-provider-gauntlet --out release-evidence/nolane-provider-v7-repeat.json
          cmp release-evidence/nolane-provider-v7.json release-evidence/nolane-provider-v7-repeat.json
          if grep -Fq 'SYNTHETIC-V7-SECRET' release-evidence/nolane-provider-v7.json; then
            echo 'synthetic credential leaked into v7 evidence as plaintext' >&2
            exit 1
          fi
          if grep -Fq 'U1lOVEhFVElDLVY3LVNFQ1JFVA==' release-evidence/nolane-provider-v7.json; then
            echo 'synthetic credential leaked into v7 evidence as base64' >&2
            exit 1
          fi
          if grep -Fq '53594e5448455449432d56372d534543524554' release-evidence/nolane-provider-v7.json; then
            echo 'synthetic credential leaked into v7 evidence as hex' >&2
            exit 1
          fi
          rm release-evidence/nolane-provider-v7-repeat.json

      - name: Generate Freedom Plane evidence
        working-directory: NolaneWorld
        run: |
          go run ./cmd/nolane-freedom-gauntlet --out release-evidence/nolane-freedom-v8.json
          go run ./cmd/nolane-freedom-gauntlet --out release-evidence/nolane-freedom-v8-repeat.json
          cmp release-evidence/nolane-freedom-v8.json release-evidence/nolane-freedom-v8-repeat.json
          if grep -Fq 'SYNTHETIC-V8-CREDENTIAL' release-evidence/nolane-freedom-v8.json; then
            echo 'synthetic credential leaked into v8 evidence as plaintext' >&2
            exit 1
          fi
          if grep -Fq 'U1lOVEhFVElDLVY4LUNSRURFTlRJQUw=' release-evidence/nolane-freedom-v8.json; then
            echo 'synthetic credential leaked into v8 evidence as base64' >&2
            exit 1
          fi
          if grep -Fq '53594e5448455449432d56382d43524544454e5449414c' release-evidence/nolane-freedom-v8.json; then
            echo 'synthetic credential leaked into v8 evidence as hex' >&2
            exit 1
          fi
          rm release-evidence/nolane-freedom-v8-repeat.json

      - name: Generate Live Realm Proof v9 negative-control evidence
        working-directory: NolaneWorld
        env:
          NOLANE_CUBE_API_KEY: SYNTHETIC-V9-CUBE-CREDENTIAL
        run: |
          go run ./cmd/nolane-realm-gauntlet-live \
            --mode probe \
            --profile R0_INTERNAL_ONLY \
            --raw-public-kind http \
            --raw-public-target https://example.invalid/nolane-v9-negative-control \
            --out release-evidence/nolane-realm-live-v9-unavailable.json
          go run ./cmd/nolane-realm-gauntlet-live \
            --mode probe \
            --profile R0_INTERNAL_ONLY \
            --raw-public-kind http \
            --raw-public-target https://example.invalid/nolane-v9-negative-control \
            --out release-evidence/nolane-realm-live-v9-unavailable-repeat.json
          cmp release-evidence/nolane-realm-live-v9-unavailable.json release-evidence/nolane-realm-live-v9-unavailable-repeat.json
          grep -Fq '"status": "UNAVAILABLE"' release-evidence/nolane-realm-live-v9-unavailable.json
          grep -Fq '"approved": false' release-evidence/nolane-realm-live-v9-unavailable.json
          if grep -Fq 'SYNTHETIC-V9-CUBE-CREDENTIAL' release-evidence/nolane-realm-live-v9-unavailable.json; then
            echo 'synthetic credential leaked into v9 evidence as plaintext' >&2
            exit 1
          fi
          if grep -Fq 'U1lOVEhFVElDLVY5LUNVQkUtQ1JFREVOVElBTA==' release-evidence/nolane-realm-live-v9-unavailable.json; then
            echo 'synthetic credential leaked into v9 evidence as base64' >&2
            exit 1
          fi
          if grep -Fq '53594e5448455449432d56392d435542452d43524544454e5449414c' release-evidence/nolane-realm-live-v9-unavailable.json; then
            echo 'synthetic credential leaked into v9 evidence as hex' >&2
            exit 1
          fi
          rm release-evidence/nolane-realm-live-v9-unavailable-repeat.json

      - name: Generate State Continuity Evidence Fusion v10 negative-control evidence
        working-directory: NolaneWorld
        env:
          NOLANE_CUBE_API_KEY: SYNTHETIC-V10-CUBE-CREDENTIAL
          NOLANE_CUBE_API_URL: ''
          NOLANE_CUBE_TEMPLATE_ID: ''
          NOLANE_CUBE_SANDBOX_DOMAIN: ''
          NOLANE_CUBE_PROXY_SCHEME: ''
        run: |
          go run ./cmd/nolane-capability-gauntlet-live \
            --mode probe \
            --profile R0_INTERNAL_ONLY \
            --raw-public-kind http \
            --raw-public-target https://example.invalid/nolane-v10-negative-control \
            --out release-evidence/nolane-capability-live-v10-unavailable.json
          go run ./cmd/nolane-capability-gauntlet-live \
            --mode probe \
            --profile R0_INTERNAL_ONLY \
            --raw-public-kind http \
            --raw-public-target https://example.invalid/nolane-v10-negative-control \
            --out release-evidence/nolane-capability-live-v10-unavailable-repeat.json
          cmp release-evidence/nolane-capability-live-v10-unavailable.json release-evidence/nolane-capability-live-v10-unavailable-repeat.json
          grep -Fq '"status": "UNAVAILABLE"' release-evidence/nolane-capability-live-v10-unavailable.json
          grep -Fq '"approved": false' release-evidence/nolane-capability-live-v10-unavailable.json
          grep -Fq '"reason": "config_missing"' release-evidence/nolane-capability-live-v10-unavailable.json
          if grep -Fq 'SYNTHETIC-V10-CUBE-CREDENTIAL' release-evidence/nolane-capability-live-v10-unavailable.json; then
            echo 'synthetic credential leaked into v10 evidence as plaintext' >&2
            exit 1
          fi
          if grep -Fq 'U1lOVEhFVElDLVYxMC1DVUJFLUNSRURFTlRJQUw=' release-evidence/nolane-capability-live-v10-unavailable.json; then
            echo 'synthetic credential leaked into v10 evidence as base64' >&2
            exit 1
          fi
          if grep -Fq '53594e5448455449432d5631302d435542452d43524544454e5449414c' release-evidence/nolane-capability-live-v10-unavailable.json; then
            echo 'synthetic credential leaked into v10 evidence as hex' >&2
            exit 1
          fi
          rm release-evidence/nolane-capability-live-v10-unavailable-repeat.json

      - name: Upload Release Gauntlet evidence
        uses: actions/upload-artifact@v4
        with:
          name: nolane-gauntlet-v4-${{ github.sha }}
          path: NolaneWorld/release-evidence/nolane-gauntlet-v4.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Delegated Authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: nolane-authority-v6-${{ github.sha }}
          path: NolaneWorld/release-evidence/nolane-authority-v6.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Provider Authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: nolane-provider-v7-${{ github.sha }}
          path: NolaneWorld/release-evidence/nolane-provider-v7.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Freedom Plane evidence
        uses: actions/upload-artifact@v4
        with:
          name: nolane-freedom-v8-${{ github.sha }}
          path: NolaneWorld/release-evidence/nolane-freedom-v8.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Live Realm Proof v9 negative-control evidence
        uses: actions/upload-artifact@v4
        with:
          name: nolane-realm-live-v9-unavailable-${{ github.sha }}
          path: NolaneWorld/release-evidence/nolane-realm-live-v9-unavailable.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload State Continuity Evidence Fusion v10 negative-control evidence
        uses: actions/upload-artifact@v4
        with:
          name: nolane-capability-live-v10-unavailable-${{ github.sha }}
          path: NolaneWorld/release-evidence/nolane-capability-live-v10-unavailable.json
          if-no-files-found: error
          retention-days: 30

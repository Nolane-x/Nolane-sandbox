name: Nolane World Check

on:
  pull_request:
    paths:
      - 'NolaneWorld/**'
      - 'docs/superpowers/specs/**nolane-sandbox**'
      - 'docs/superpowers/plans/**nolane-sandbox**'
      - '.github/workflows/nolane-world-check.yml'
  push:
    branches: [master]
    paths:
      - 'NolaneWorld/**'
      - '.github/workflows/nolane-world-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nolane-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trust-kernel:
    name: Trust Kernel contract suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: NolaneWorld/go.mod

      - name: Unit and race tests
        working-directory: NolaneWorld
        run: go test -race ./...

      - name: Vet
        working-directory: NolaneWorld
        run: go vet ./...

name: Wave21 Apply Shim Wiring Once

on:
  push:
    branches:
      - gpt/wave21-guest-kernel-oom-victim-provenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/wave21-guest-kernel-oom-victim-provenance
          fetch-depth: 0
      - name: Apply exact Wave21 production wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          lib = Path("CubeShim/shim/src/lib.rs")
          text = lib.read_text()
          if "pub mod guest_victim;" not in text:
              replace_once(
                  lib,
                  "pub mod cube;\npub mod hypervisor;",
                  "pub mod cube;\npub mod guest_victim;\npub mod hypervisor;",
              )

          container = Path("CubeShim/shim/src/container/mod.rs")
          text = container.read_text()
          if "pub async fn start_container_with_oom_victim" not in text:
              replace_once(
                  container,
                  "    pub async fn start_container(&mut self) -> CResult<()> {\n        if !self.passfd_io_enabled() {",
                  "    pub async fn start_container(&mut self) -> CResult<()> {\n        self.start_container_with_oom_victim(None).await\n    }\n\n    pub async fn start_container_with_oom_victim(\n        &mut self,\n        oom_victim_realization_token: Option<&[u8; 32]>,\n    ) -> CResult<()> {\n        if !self.passfd_io_enabled() {",
              )
              replace_once(
                  container,
                  "            let req = agent::StartContainerRequest {\n                container_id: self.id.clone(),\n                ..Default::default()\n            };",
                  "            let req = agent::StartContainerRequest {\n                container_id: self.id.clone(),\n                oom_victim_realization_token: oom_victim_realization_token\n                    .map(|token| token.to_vec())\n                    .unwrap_or_default(),\n                ..Default::default()\n            };",
              )

          sb = Path("CubeShim/shim/src/sandbox/sb.rs")
          text = sb.read_text()
          if "pub async fn start_container_with_oom_victim" not in text:
              replace_once(
                  sb,
                  "use crate::hypervisor::snapshot::{enable_snapshot, SnapshotInfo};\nuse crate::log::{stat_defer, Log};",
                  "use crate::guest_victim::RealizationToken;\nuse crate::hypervisor::snapshot::{enable_snapshot, SnapshotInfo};\nuse crate::log::{stat_defer, Log};",
              )
              replace_once(
                  sb,
                  "    pub async fn start_container(&mut self, id: &String) -> Result<()> {\n        let mut containers = self.containers.lock().await;\n        let container = match containers.get_mut(id) {\n            Some(c) => c,\n            None => return Err(Error::NotFoundError(format!(\"not found container:{}\", id))),\n        };\n        container\n            .start_container()\n            .await\n            .map_err(|e| Error::Other(e.to_string()))?;\n        Ok(())\n    }",
                  "    pub async fn start_container(&mut self, id: &String) -> Result<()> {\n        self.start_container_with_oom_victim(id, None).await\n    }\n\n    pub async fn start_container_with_oom_victim(\n        &mut self,\n        id: &String,\n        token: Option<RealizationToken>,\n    ) -> Result<()> {\n        let mut containers = self.containers.lock().await;\n        let container = match containers.get_mut(id) {\n            Some(c) => c,\n            None => return Err(Error::NotFoundError(format!(\"not found container:{}\", id))),\n        };\n        container\n            .start_container_with_oom_victim(token.as_ref().map(RealizationToken::as_bytes))\n            .await\n            .map_err(|e| Error::Other(e.to_string()))?;\n        Ok(())\n    }",
              )
              replace_once(
                  sb,
                  "    pub async fn wait_container(&self, id: &String, exec_id: &str) -> Result<(u32, DateTime<Utc>)> {",
                  "    pub async fn get_oom_victim_evidence(\n        &self,\n        id: &str,\n        token: &[u8; 32],\n    ) -> Result<Vec<u8>> {\n        use protobuf::Message;\n\n        let guest_container_id = self.guest_container_id(id).await?;\n        let client = self\n            .client\n            .as_ref()\n            .ok_or_else(|| Error::Other(\"guest agent is not connected\".to_string()))?\n            .lock()\n            .await;\n        let req = agent::GetOOMVictimEvidenceRequest {\n            container_id: guest_container_id,\n            realization_token: token.to_vec(),\n            ..Default::default()\n        };\n        let response = client\n            .get_oom_victim_evidence(self.ctx.clone(), &req)\n            .await\n            .map_err(|e| Error::Other(format!(\"GetOOMVictimEvidence failed for {}: {}\", id, e)))?;\n        response\n            .write_to_bytes()\n            .map_err(|e| Error::Other(format!(\"encode OOM victim evidence failed for {}: {}\", id, e)))\n    }\n\n    pub async fn wait_container(&self, id: &String, exec_id: &str) -> Result<(u32, DateTime<Utc>)> {",
              )

          task = Path("CubeShim/shim/src/service/task_srv.rs")
          text = task.read_text()
          if "victim_bindings: Arc<Mutex<TokenBindings>>" not in text:
              replace_once(task, "use std::sync::Arc;", "use std::collections::HashMap;\nuse std::sync::Arc;")
              replace_once(
                  task,
                  "use crate::container::{container_mgr::ContainerInfo, exec::Tty};\nuse crate::log::{stat_defer, Log, LogLevel};",
                  "use crate::container::{container_mgr::ContainerInfo, exec::Tty};\nuse crate::guest_victim::{EvidenceCache, RealizationToken, TokenBindings, EVIDENCE_METADATA_KEY, EVIDENCE_TYPE_URL};\nuse crate::guest_victim::parse_bind_annotations;\nuse crate::log::{stat_defer, Log, LogLevel};",
              )
              replace_once(
                  task,
                  "    exit: Arc<ExitSignal>,\n    tx_containerd: Sender<(String, Box<dyn MessageDyn>)>,",
                  "    exit: Arc<ExitSignal>,\n    tx_containerd: Sender<(String, Box<dyn MessageDyn>)>,\n    victim_bindings: Arc<Mutex<TokenBindings>>,\n    victim_active: Arc<Mutex<HashMap<String, RealizationToken>>>,\n    victim_evidence: Arc<Mutex<EvidenceCache>>,",
              )
              replace_once(
                  task,
                  "            exit,\n            tx_containerd: tx,\n        }",
                  "            exit,\n            tx_containerd: tx,\n            victim_bindings: Arc::new(Mutex::new(TokenBindings::default())),\n            victim_active: Arc::new(Mutex::new(HashMap::new())),\n            victim_evidence: Arc::new(Mutex::new(EvidenceCache::default())),\n        }",
              )
              replace_once(
                  task,
                  "        infof!(self.log, \"create req start\");\n        let start = Instant::now();",
                  "        infof!(self.log, \"create req start\");\n        self.victim_bindings.lock().await.clear(&req.id);\n        self.victim_active.lock().await.remove(&req.id);\n        self.victim_evidence.lock().await.clear(&req.id);\n        let start = Instant::now();",
              )
              replace_once(
                  task,
                  "        let mut sb = self.sandbox.lock().await;\n        if sb.paused().await {\n            errf!(self.log, \"sandbox not in normal state\");\n            return Err(Others(format!(\"sandbox not in normal state\")));\n        }\n        if req.exec_id().is_empty() {\n            sb.start_container(&req.id).await.map_err(|e| {",
                  "        let victim_token = if req.exec_id().is_empty() {\n            self.victim_bindings.lock().await.consume_main(&req.id)\n        } else {\n            None\n        };\n        let mut sb = self.sandbox.lock().await;\n        if sb.paused().await {\n            errf!(self.log, \"sandbox not in normal state\");\n            return Err(Others(format!(\"sandbox not in normal state\")));\n        }\n        if req.exec_id().is_empty() {\n            sb.start_container_with_oom_victim(&req.id, victim_token).await.map_err(|e| {",
              )
              replace_once(
                  task,
                  "            })?;\n\n            let event = TaskStart {",
                  "            })?;\n            if let Some(token) = victim_token {\n                self.victim_active.lock().await.insert(req.id.clone(), token);\n            }\n\n            let event = TaskStart {",
              )
              replace_once(
                  task,
                  "        let e_tm: protobuf::well_known_types::timestamp::Timestamp =",
                  "        if req.exec_id().is_empty() {\n            if let Some(token) = self.victim_active.lock().await.remove(&req.id) {\n                match sb.get_oom_victim_evidence(&req.id, token.as_bytes()).await {\n                    Ok(payload) if !payload.is_empty() => {\n                        if let Err(e) = self\n                            .victim_evidence\n                            .lock()\n                            .await\n                            .insert_finalized(&req.id, token, payload)\n                        {\n                            warnf!(self.log, \"cache Wave21 evidence failed for {}: {}\", req.id, e);\n                        }\n                    }\n                    Ok(_) => warnf!(self.log, \"guest returned empty Wave21 evidence for {}\", req.id),\n                    Err(e) => warnf!(self.log, \"guest Wave21 evidence unavailable for {}: {}\", req.id, e),\n                }\n            }\n        }\n        let e_tm: protobuf::well_known_types::timestamp::Timestamp =",
              )
              replace_once(
                  task,
                  "    async fn stats(\n        &self,\n        _ctx: &TtrpcContext,\n        req: api::StatsRequest,\n    ) -> TtrpcResult<api::StatsResponse> {\n        if req.id.is_empty() {\n            return Err(Error::InvalidArgument(\"stats request id is empty\".to_string()).into());\n        }\n\n        let sb = {",
                  "    async fn stats(\n        &self,\n        ctx: &TtrpcContext,\n        req: api::StatsRequest,\n    ) -> TtrpcResult<api::StatsResponse> {\n        if req.id.is_empty() {\n            return Err(Error::InvalidArgument(\"stats request id is empty\".to_string()).into());\n        }\n\n        if let Some(values) = ctx.metadata.get(EVIDENCE_METADATA_KEY) {\n            if values.len() != 1 {\n                return Err(Error::InvalidArgument(\"Wave21 evidence selector must have exactly one value\".to_string()).into());\n            }\n            let mut metadata = HashMap::new();\n            metadata.insert(EVIDENCE_METADATA_KEY.to_string(), values[0].clone());\n            let selected = self\n                .victim_evidence.lock().await.select(&req.id, &metadata)\n                .map_err(|e| Error::InvalidArgument(e.to_string()))?;\n            let payload = selected.ok_or_else(|| {\n                Error::FailedPreconditionError(\"Wave21 finalized evidence is unavailable for exact realization token\".to_string())\n            })?;\n            let stats = protobuf::well_known_types::any::Any {\n                type_url: EVIDENCE_TYPE_URL.to_string(),\n                value: payload,\n                ..Default::default()\n            };\n            return Ok(api::StatsResponse {\n                stats: Some(stats).into(),\n                ..Default::default()\n            });\n        }\n\n        let sb = {",
              )
              replace_once(
                  task,
                  "        infof!(self.log, \"delete req start, id:{}, execid:{}\",\n            req.id(),\n            req.exec_id()\n        );",
                  "        infof!(self.log, \"delete req start, id:{}, execid:{}\",\n            req.id(),\n            req.exec_id()\n        );\n        if req.exec_id().is_empty() {\n            self.victim_bindings.lock().await.clear(&req.id);\n            self.victim_active.lock().await.remove(&req.id);\n            self.victim_evidence.lock().await.clear(&req.id);\n        }",
              )
              replace_once(
                  task,
                  "        infof!(self.log, \"update req start, id:{}\", &req.id);\n        let outcome = {",
                  "        infof!(self.log, \"update req start, id:{}\", &req.id);\n        if let Some(token) = parse_bind_annotations(&req.annotations)\n            .map_err(|e| Error::InvalidArgument(e.to_string()))?\n        {\n            self.victim_bindings\n                .lock()\n                .await\n                .bind(&req.id, token)\n                .map_err(|e| Error::FailedPreconditionError(e.to_string()))?;\n            infof!(self.log, \"bound Wave21 realization token for next main start: {}\", req.id);\n            return Ok(api::Empty::default());\n        }\n        let outcome = {",
              )
              replace_once(
                  task,
                  "        infof!(self.log, \"shutdown req start\");\n\n        let mut sb = self.sandbox.lock().await;",
                  "        infof!(self.log, \"shutdown req start\");\n        self.victim_bindings.lock().await.clear_all();\n        self.victim_active.lock().await.clear();\n        self.victim_evidence.lock().await.clear_all();\n\n        let mut sb = self.sandbox.lock().await;",
              )

          print("Wave21 production shim wiring applied")
          PY
          cargo fmt --manifest-path CubeShim/Cargo.toml --all
          git diff --check
      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CubeShim/shim/src/lib.rs CubeShim/shim/src/container/mod.rs CubeShim/shim/src/sandbox/sb.rs CubeShim/shim/src/service/task_srv.rs
          git commit -m "feat(v21): wire exact guest victim evidence through shim" -m "Autonomously-by: ChatGPT:GPT-5.6-Sol"
          git push origin HEAD:gpt/wave21-guest-kernel-oom-victim-provenance

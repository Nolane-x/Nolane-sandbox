name: Cube Guest Kernel OOM Victim Contract

on:
  pull_request:
  push:
    branches:
      - gpt/wave21-guest-kernel-oom-victim-provenance

permissions:
  contents: write

jobs:
  repair-nolaneworld-wave21:
    if: github.event_name == 'push' && github.ref == 'refs/heads/gpt/wave21-guest-kernel-oom-victim-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/wave21-guest-kernel-oom-victim-provenance
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: NolaneWorld/go.mod
          cache: false
      - name: Repair same-scrape evidence without breaking Wave18 comparability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          task = Path('NolaneWorld/substrate/cube/task_termination.go')
          text = task.read_text()
          old_struct = '''type TaskTerminationEvidence struct {
          \tOutcome               TaskOutcomeProof
          \tRealizationOOM        *RealizationOOMProof
          \tHostProcessIdentity   *HostSandboxProcessIdentityProof
          \tHostKernelOOMVictim   *HostKernelOOMVictimProof
          \tGuestKernelOOMVictims []GuestKernelOOMVictimProof
          }'''
          new_struct = '''type guestKernelOOMVictimSet struct {
          \tproofs []GuestKernelOOMVictimProof
          }

          type TaskTerminationEvidence struct {
          \tOutcome               TaskOutcomeProof
          \tRealizationOOM        *RealizationOOMProof
          \tHostProcessIdentity   *HostSandboxProcessIdentityProof
          \tHostKernelOOMVictim   *HostKernelOOMVictimProof
          \tguestKernelOOMVictims *guestKernelOOMVictimSet
          }

          // GuestKernelOOMVictimProofs returns a defensive copy of positive Wave21
          // proofs from this exact metrics scrape. Absence remains unknown.
          func (e TaskTerminationEvidence) GuestKernelOOMVictimProofs() []GuestKernelOOMVictimProof {
          \tif e.guestKernelOOMVictims == nil || len(e.guestKernelOOMVictims.proofs) == 0 {
          \t\treturn nil
          \t}
          \treturn append([]GuestKernelOOMVictimProof(nil), e.guestKernelOOMVictims.proofs...)
          }'''
          if old_struct not in text:
              raise SystemExit('TaskTerminationEvidence direct slice shape missing')
          text = text.replace(old_struct, new_struct, 1)

          old_assign = '\tevidence.GuestKernelOOMVictims = append([]GuestKernelOOMVictimProof(nil), guestVictims...)\n\treturn evidence, true, nil'
          new_assign = '''\tif len(guestVictims) > 0 {
          \t\tevidence.guestKernelOOMVictims = &guestKernelOOMVictimSet{
          \t\t\tproofs: append([]GuestKernelOOMVictimProof(nil), guestVictims...),
          \t\t}
          \t}
          \treturn evidence, true, nil'''
          if old_assign not in text:
              raise SystemExit('same-scrape assignment anchor missing')
          text = text.replace(old_assign, new_assign, 1)
          if 'func correlateRealizationOOM(' not in text:
              text = text.rstrip() + '''\n\nfunc correlateRealizationOOM(outcome TaskOutcomeProof, oom RealizationOOMProof) error {
          \tif oom.SandboxID != outcome.SandboxID ||
          \t\toom.Generation != outcome.Generation ||
          \t\toom.OutcomeSource != outcome.Source ||
          \t\t!oom.ExitedAt.Equal(outcome.ExitedAt) {
          \t\treturn fmt.Errorf("%w: realization OOM proof does not match exact task outcome", ErrTaskOutcomeUnavailable)
          \t}
          \treturn nil
          }\n'''
          task.write_text(text)

          helper = Path('NolaneWorld/substrate/cube/task_termination_guest_victim.go')
          text = helper.read_text()
          text = text.replace('len(e.GuestKernelOOMVictims)', 'len(e.GuestKernelOOMVictimProofs())')
          text = text.replace('range e.GuestKernelOOMVictims', 'range e.GuestKernelOOMVictimProofs()')
          helper.write_text(text)

          test = Path('NolaneWorld/substrate/cube/task_termination_guest_victim_v21_test.go')
          text = test.read_text()
          text = text.replace('len(evidence.GuestKernelOOMVictims)', 'len(evidence.GuestKernelOOMVictimProofs())')
          test.write_text(text)
          PY
          gofmt -w NolaneWorld/substrate/cube/task_termination.go NolaneWorld/substrate/cube/task_termination_guest_victim.go NolaneWorld/substrate/cube/task_termination_guest_victim_v21_test.go
          (cd NolaneWorld && go test ./substrate/cube -run 'TestV21|TestV18|TestTaskTermination|TaskOutcome' -count=1)
          git diff --check
          git rm -f .github/workflows/wave21-fix-nolaneworld-comparability-once.yml || true
          git show HEAD^:.github/workflows/cube-guest-kernel-oom-victim-contract.yml > .github/workflows/cube-guest-kernel-oom-victim-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "fix(wave21): preserve termination evidence comparability" -m "Keep same-scrape guest victim proofs behind a pointer-backed defensive accessor and restore the Wave18 realization correlation tail." -m "Autonomously-by: ChatGPT:GPT-5.6-Sol"
          git push origin HEAD:gpt/wave21-guest-kernel-oom-victim-provenance

  protocol-wave21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify guest/shim Wave21 protocol parity and production seams
        run: |
          python3 tests/wave21_protocol_contract.py
          python3 tests/wave21_agent_service_contract.py
          python3 tests/wave21_shim_service_contract.py

  cubelet-wave21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Cubelet/go.mod
          cache-dependency-path: Cubelet/go.sum
      - name: Verify Wave21 generation, binding, and Prometheus contracts
        working-directory: Cubelet
        run: |
          go test ./plugins/cube/internals/sandbox -run '^TestV21' -count=1
          go test ./plugins/cube/internals/guestvictim -run '^(TestBindBeforeStart|TestV21)' -count=1
          go test ./plugins/cube/internals/resourcemetrics -run '^TestV21' -count=1

  guest-wave21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify guest realization evidence contract
        working-directory: agent
        run: |
          rustc --edition=2021 --test tests/guest_oom_victim_v21.rs -o /tmp/guest_oom_victim_v21
          /tmp/guest_oom_victim_v21 --nocapture
          rustc --edition=2021 --test tests/guest_oom_victim_lookup_v21.rs -o /tmp/guest_oom_victim_lookup_v21
          /tmp/guest_oom_victim_lookup_v21 --nocapture
          rustc --edition=2021 --test tests/guest_oom_victim_metadata_v21.rs -o /tmp/guest_oom_victim_metadata_v21
          /tmp/guest_oom_victim_metadata_v21 --nocapture
          rustc --edition=2021 --test tests/guest_oom_victim_bounds_v21.rs -o /tmp/guest_oom_victim_bounds_v21
          /tmp/guest_oom_victim_bounds_v21 --nocapture
          rustc --edition=2021 --test tests/guest_oom_victim_loader_v21.rs -o /tmp/guest_oom_victim_loader_v21
          /tmp/guest_oom_victim_loader_v21 --nocapture
          rustc --edition=2021 --test tests/guest_oom_victim_timebridge_v21.rs -o /tmp/guest_oom_victim_timebridge_v21
          /tmp/guest_oom_victim_timebridge_v21 --nocapture

  shim-wave21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CubeShim realization-token and evidence-validation contracts
        working-directory: CubeShim/shim
        run: |
          rustc --edition=2021 --test tests/guest_victim_v21.rs -o /tmp/guest_victim_v21
          /tmp/guest_victim_v21 --nocapture
          rustc --edition=2021 --test tests/guest_victim_binding_v21.rs -o /tmp/guest_victim_binding_v21
          /tmp/guest_victim_binding_v21 --nocapture
          rustc --edition=2021 --test tests/guest_victim_transport_v21.rs -o /tmp/guest_victim_transport_v21
          /tmp/guest_victim_transport_v21 --nocapture
          rustc --edition=2021 --test tests/guest_victim_evidence_validation_v21.rs -o /tmp/guest_victim_evidence_validation_v21
          /tmp/guest_victim_evidence_validation_v21 --nocapture

  nolaneworld-wave21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: NolaneWorld/go.mod
          cache-dependency-path: NolaneWorld/go.sum
      - name: Verify Wave21 strict consumer contract
        working-directory: NolaneWorld
        run: go test ./substrate/cube -run '^TestV21' -count=1

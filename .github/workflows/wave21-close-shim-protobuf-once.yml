name: Wave21 Close Shim Protobuf Once
on:
  push:
    branches: [gpt/wave21-guest-kernel-oom-victim-provenance]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/wave21-guest-kernel-oom-victim-provenance
          fetch-depth: 0
      - name: Patch protobuf ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('CubeShim/protoc/src/lib.rs')
          text = lib.read_text()
          helper = '''\n/// Serialize Wave21 guest-victim evidence using the protobuf runtime that\n/// generated the agent protocol types. CubeShim itself intentionally uses a\n/// newer protobuf runtime for containerd messages, so serialization authority\n/// stays inside this crate to avoid cross-version trait ambiguity.\npub fn encode_oom_victim_evidence(\n    response: &agent::GetOOMVictimEvidenceResponse,\n) -> protobuf::ProtobufResult<Vec<u8>> {\n    use protobuf::Message;\n    response.write_to_bytes()\n}\n'''
          if 'pub fn encode_oom_victim_evidence' not in text:
              lib.write_text(text.rstrip() + '\n' + helper)

          sb = Path('CubeShim/shim/src/sandbox/sb.rs')
          text = sb.read_text()
          old = '''        use protobuf::Message;\n        let guest_container_id = self.guest_container_id(id).await?;'''
          new = '''        let guest_container_id = self.guest_container_id(id).await?;'''
          if text.count(old) != 1:
              raise SystemExit(f'expected protobuf Message anchor once, got {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''        response.write_to_bytes().map_err(|e| {\n            Error::Other(format!(\n                "encode OOM victim evidence failed for {}: {}",\n                id, e\n            ))\n        })'''
          new = '''        protoc::encode_oom_victim_evidence(&response).map_err(|e| {\n            Error::Other(format!(\n                "encode OOM victim evidence failed for {}: {}",\n                id, e\n            ))\n        })'''
          if text.count(old) != 1:
              raise SystemExit(f'expected response serialization anchor once, got {text.count(old)}')
          sb.write_text(text.replace(old, new, 1))
          PY
          rustfmt --edition 2021 CubeShim/protoc/src/lib.rs CubeShim/shim/src/sandbox/sb.rs
          git diff --check
      - name: Compile shim library
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path CubeShim/shim/Cargo.toml --lib --no-run
      - name: Commit protobuf closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CubeShim/protoc/src/lib.rs CubeShim/shim/src/sandbox/sb.rs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(v21): serialize guest evidence with protocol protobuf" -m "Autonomously-by: ChatGPT:GPT-5.6-Sol"
          git push origin HEAD:gpt/wave21-guest-kernel-oom-victim-provenance

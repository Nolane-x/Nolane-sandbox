name: Wave21 Final CI Cleanup Once

on:
  push:
    branches: [gpt/wave21-guest-kernel-oom-victim-provenance]
    paths:
      - .github/workflows/wave21-final-ci-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/wave21-guest-kernel-oom-victim-provenance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Remove superseded Wave21 seams and format final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('agent/src/guest_oom_victim.rs'): (
                  '''    pub fn note_loss(&mut self) {\n        self.loss_epoch = self.loss_epoch.saturating_add(1);\n    }\n\n''',
                  '',
              ),
              Path('agent/src/sandbox.rs'): (
                  '''    pub fn note_guest_oom_victim_loss(&mut self) {\n        self.guest_oom_victim.note_loss();\n        self.guest_oom_victim_collector.note_loss();\n    }\n\n''',
                  '',
              ),
              Path('agent/src/oom_victim_runtime.rs'): (
                  '''    pub fn geometry(&self) -> RingGeometry {\n        self.geometry\n    }\n\n''',
                  '',
              ),
              Path('tests/wave21_agent_service_contract.py'): (
                  '''    "note_guest_oom_victim_loss",\n''',
                  '',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected Wave21 cleanup anchor missing in {path}')
              if text.count(old) != 1:
                  raise SystemExit(f'Wave21 cleanup anchor not unique in {path}')
              path.write_text(text.replace(old, new, 1))
          PY

          make fmt
          python3 tests/wave21_agent_service_contract.py
          cargo test --locked --manifest-path agent/Cargo.toml \
            --test guest_oom_victim_liveness_v21 \
            --test guest_oom_victim_runtime_v21
          make -C agent MUSL=no SECCOMP=no src/version.rs
          RUSTFLAGS='-D warnings' cargo check --locked --manifest-path agent/Cargo.toml --bin cube-agent
          rm -f agent/src/version.rs
          git diff --check
          git status --short
      - name: Commit verified final CI cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'fix(wave21): close final format and release warnings' -m 'Autonomously-by: ChatGPT:GPT-5.6-Sol'
          git push origin HEAD:gpt/wave21-guest-kernel-oom-victim-provenance

name: Wave 15 Self Apply

on:
  push:
    branches:
      - wave15-cube-oom-provenance
    paths:
      - .github/workflows/wave15-self-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave15-cube-oom-provenance
          fetch-depth: 0

      - name: Apply exact Wave 15 production patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # cgroup v1: preserve the direct memory.oom_control OOM-kill counter.
          replace(
              "Cubelet/plugins/cube/internals/cgroup/handle/v1/manager.go",
              '''\tif handle.IsCgroupV1UnlimitedMemoryLimit(limit.Value) {\n\t\tlimit.Value = 0\n\t\tlimit.Unlimited = true\n\t}\n\n\treturn handle.UsageSnapshot{''',
              '''\tif handle.IsCgroupV1UnlimitedMemoryLimit(limit.Value) {\n\t\tlimit.Value = 0\n\t\tlimit.Unlimited = true\n\t}\n\toomKillsKnown := metrics.MemoryOomControl != nil\n\tvar oomKills uint64\n\tif oomKillsKnown {\n\t\toomKills = metrics.MemoryOomControl.OomKill\n\t}\n\n\treturn handle.UsageSnapshot{''',
          )
          replace(
              "Cubelet/plugins/cube/internals/cgroup/handle/v1/manager.go",
              '''\t\tMemoryFailuresTotal:      memory.GetFailcnt(),\n\t}, nil''',
              '''\t\tMemoryFailuresTotal:      memory.GetFailcnt(),\n\t\tMemoryOOMKillsKnown:      oomKillsKnown,\n\t\tMemoryOOMKillsTotal:      oomKills,\n\t}, nil''',
          )

          # cgroup v2: preserve the direct memory.events oom_kill counter.
          replace(
              "Cubelet/plugins/cube/internals/cgroup/handle/v2/manager.go",
              '''\tevents := metrics.GetMemoryEvents()\n\treturn handle.UsageSnapshot{''',
              '''\tevents := metrics.GetMemoryEvents()\n\toomKillsKnown := events != nil\n\tvar oomKills uint64\n\tif oomKillsKnown {\n\t\toomKills = events.GetOomKill()\n\t}\n\treturn handle.UsageSnapshot{''',
          )
          replace(
              "Cubelet/plugins/cube/internals/cgroup/handle/v2/manager.go",
              '''\t\tMemoryFailuresTotal:      events.GetMax(),\n\t}, nil''',
              '''\t\tMemoryFailuresTotal:      events.GetMax(),\n\t\tMemoryOOMKillsKnown:      oomKillsKnown,\n\t\tMemoryOOMKillsTotal:      oomKills,\n\t}, nil''',
          )

          # Capture OOM provenance at the exact cgroup assignment baseline.
          replace(
              "Cubelet/plugins/cube/internals/cgroup/local.go",
              '''\t\tMemoryFailuresTotal:      usage.MemoryFailuresTotal,\n\t}, nil\n}''',
              '''\t\tMemoryFailuresTotal:      usage.MemoryFailuresTotal,\n\t\tMemoryOOMKillsKnown:      usage.MemoryOOMKillsKnown,\n\t\tMemoryOOMKillsTotal:      usage.MemoryOOMKillsTotal,\n\t}, nil\n}''',
          )

          # Carry and normalize OOM evidence through the host sampler.
          replace(
              "Cubelet/plugins/cube/internals/resourcemetrics/host_sandbox_sampler.go",
              '''\tMemoryLimitUnlimited     bool\n\tMemoryFailuresTotal      uint64\n}''',
              '''\tMemoryLimitUnlimited     bool\n\tMemoryFailuresTotal      uint64\n\tMemoryOOMKillsKnown      bool\n\tMemoryOOMKillsTotal      uint64\n}''',
          )
          replace(
              "Cubelet/plugins/cube/internals/resourcemetrics/host_sandbox_sampler.go",
              '''\t\tMemoryLimitUnlimited:     usage.MemoryLimit.Unlimited,\n\t\tMemoryFailuresTotal:      usage.MemoryFailuresTotal,\n\t}\n}''',
              '''\t\tMemoryLimitUnlimited:     usage.MemoryLimit.Unlimited,\n\t\tMemoryFailuresTotal:      usage.MemoryFailuresTotal,\n\t\tMemoryOOMKillsKnown:      usage.MemoryOOMKillsKnown,\n\t\tMemoryOOMKillsTotal:      usage.MemoryOOMKillsTotal,\n\t}\n}''',
          )
          replace(
              "Cubelet/plugins/cube/internals/resourcemetrics/host_sandbox_sampler.go",
              '''\t\tCPUThrottledPeriodsTotal: usage.CPUThrottledPeriodsTotal,\n\t\tMemoryFailuresTotal:      usage.MemoryFailuresTotal,\n\t}\n}''',
              '''\t\tCPUThrottledPeriodsTotal: usage.CPUThrottledPeriodsTotal,\n\t\tMemoryFailuresTotal:      usage.MemoryFailuresTotal,\n\t\tMemoryOOMKillsKnown:      usage.MemoryOOMKillsKnown,\n\t\tMemoryOOMKillsTotal:      usage.MemoryOOMKillsTotal,\n\t}\n}''',
          )
          replace(
              "Cubelet/plugins/cube/internals/resourcemetrics/host_sandbox_sampler.go",
              '''\tresult := usage\n\tcounters := []struct {''',
              '''\tresult := usage\n\tif usage.MemoryOOMKillsKnown && baseline.MemoryOOMKillsKnown {\n\t\tif usage.MemoryOOMKillsTotal < baseline.MemoryOOMKillsTotal {\n\t\t\treturn handle.UsageSnapshot{}, fmt.Errorf("host sandbox OOM kill counter regressed below persisted baseline")\n\t\t}\n\t\tresult.MemoryOOMKillsTotal = usage.MemoryOOMKillsTotal - baseline.MemoryOOMKillsTotal\n\t\tresult.MemoryOOMKillsKnown = true\n\t} else {\n\t\t// OOM proof is dimension-local: preserve unrelated host resource evidence\n\t\t// while refusing to synthesize continuity for an old/missing OOM baseline.\n\t\tresult.MemoryOOMKillsKnown = false\n\t\tresult.MemoryOOMKillsTotal = 0\n\t}\n\tcounters := []struct {''',
          )

          # Export the OOM counter only when assignment-scoped provenance is known.
          replace(
              "Cubelet/plugins/cube/internals/resourcemetrics/prometheus.go",
              '''\thostMemoryFailures      = prometheus.NewDesc("cubesandbox_host_sandbox_memory_failures_total", "Host cgroup memory limit failures for the current sandbox since its assignment baseline.", hostLabels, nil)\n)''',
              '''\thostMemoryFailures      = prometheus.NewDesc("cubesandbox_host_sandbox_memory_failures_total", "Host cgroup memory limit failures for the current sandbox since its assignment baseline.", hostLabels, nil)\n\thostMemoryOOMKills      = prometheus.NewDesc("cubesandbox_host_sandbox_memory_oom_kills_total", "Kernel-observed host cgroup OOM kills for the current sandbox since its assignment baseline.", hostLabels, nil)\n)''',
          )
          replace(
              "Cubelet/plugins/cube/internals/resourcemetrics/prometheus.go",
              '''\t\thostMemoryCurrent, hostMemoryLimit, hostMemoryFailures,\n\t} {''',
              '''\t\thostMemoryCurrent, hostMemoryLimit, hostMemoryFailures, hostMemoryOOMKills,\n\t} {''',
          )
          replace(
              "Cubelet/plugins/cube/internals/resourcemetrics/prometheus.go",
              '''\tch <- prometheus.MustNewConstMetric(hostMemoryFailures, prometheus.CounterValue, float64(snapshot.MemoryFailuresTotal), labels...)\n}''',
              '''\tch <- prometheus.MustNewConstMetric(hostMemoryFailures, prometheus.CounterValue, float64(snapshot.MemoryFailuresTotal), labels...)\n\tif snapshot.MemoryOOMKillsKnown {\n\t\tch <- prometheus.MustNewConstMetric(hostMemoryOOMKills, prometheus.CounterValue, float64(snapshot.MemoryOOMKillsTotal), labels...)\n\t}\n}''',
          )

          # NolaneWorld: consume OOM evidence as an optional exact observation.
          replace(
              "NolaneWorld/substrate/cube/host_resource.go",
              '''const hostResourceMetricsPath = "/v1/metrics/resource"\nconst cpuLimitRatioTolerance = 1e-12''',
              '''const hostResourceMetricsPath = "/v1/metrics/resource"\nconst hostMemoryOOMKillsMetric = "cubesandbox_host_sandbox_memory_oom_kills_total"\nconst cpuLimitRatioTolerance = 1e-12''',
          )
          replace(
              "NolaneWorld/substrate/cube/host_resource.go",
              '''\tMemoryCurrentBytes  uint64\n\tMemoryFailures      uint64\n}''',
              '''\tMemoryCurrentBytes  uint64\n\tMemoryFailures      uint64\n\t// MemoryOOMKills is nil when the producer cannot prove assignment-scoped\n\t// kernel OOM-kill continuity. A non-nil zero is exact evidence of zero.\n\tMemoryOOMKills      *uint64\n}''',
          )
          replace(
              "NolaneWorld/substrate/cube/host_resource.go",
              '''\tfailures, err := exactUint(values["cubesandbox_host_sandbox_memory_failures_total"])\n\tif err != nil {\n\t\treturn HostResourceSnapshot{}, fmt.Errorf("%w: memory failures: %v", ErrHostResourceUnavailable, err)\n\t}\n\n\treturn HostResourceSnapshot{''',
              '''\tfailures, err := exactUint(values["cubesandbox_host_sandbox_memory_failures_total"])\n\tif err != nil {\n\t\treturn HostResourceSnapshot{}, fmt.Errorf("%w: memory failures: %v", ErrHostResourceUnavailable, err)\n\t}\n\tvar oomKills *uint64\n\tif raw, ok := values[hostMemoryOOMKillsMetric]; ok {\n\t\texact, err := exactUint(raw)\n\t\tif err != nil {\n\t\t\treturn HostResourceSnapshot{}, fmt.Errorf("%w: memory OOM kills: %v", ErrHostResourceUnavailable, err)\n\t\t}\n\t\toomKills = &exact\n\t}\n\n\treturn HostResourceSnapshot{''',
          )
          replace(
              "NolaneWorld/substrate/cube/host_resource.go",
              '''\t\tMemoryCurrentBytes:  memoryCurrent,\n\t\tMemoryFailures:      failures,\n\t}, nil''',
              '''\t\tMemoryCurrentBytes:  memoryCurrent,\n\t\tMemoryFailures:      failures,\n\t\tMemoryOOMKills:      oomKills,\n\t}, nil''',
          )
          replace(
              "NolaneWorld/substrate/cube/host_resource.go",
              '''\t"cubesandbox_host_sandbox_memory_failures_total":              {},\n}''',
              '''\t"cubesandbox_host_sandbox_memory_failures_total":              {},\n\thostMemoryOOMKillsMetric:                                        {},\n}''',
          )
          replace(
              "NolaneWorld/substrate/cube/host_resource.go",
              '''\tfor name := range hostResourceMetricNames {\n\t\tif _, ok := values[name]; !ok {''',
              '''\tfor name := range hostResourceMetricNames {\n\t\tif name == hostMemoryOOMKillsMetric {\n\t\t\tcontinue\n\t\t}\n\t\tif _, ok := values[name]; !ok {''',
          )
          PY

      - name: Format changed Go files
        shell: bash
        run: |
          gofmt -w \
            Cubelet/plugins/cube/internals/cgroup/handle/v1/manager.go \
            Cubelet/plugins/cube/internals/cgroup/handle/v2/manager.go \
            Cubelet/plugins/cube/internals/cgroup/local.go \
            Cubelet/plugins/cube/internals/resourcemetrics/host_sandbox_sampler.go \
            Cubelet/plugins/cube/internals/resourcemetrics/prometheus.go \
            NolaneWorld/substrate/cube/host_resource.go

      - name: Verify Cubelet Wave 15 contracts
        working-directory: Cubelet
        run: |
          go test ./plugins/cube/internals/cgroup/handle/v1 ./plugins/cube/internals/cgroup/handle/v2 ./plugins/cube/internals/cgroup ./plugins/cube/internals/resourcemetrics

      - name: Verify NolaneWorld Wave 15 contracts
        working-directory: NolaneWorld
        run: go test ./substrate/cube

      - name: Commit verified production implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No production patch to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Cubelet/plugins/cube/internals/cgroup/handle/v1/manager.go \
            Cubelet/plugins/cube/internals/cgroup/handle/v2/manager.go \
            Cubelet/plugins/cube/internals/cgroup/local.go \
            Cubelet/plugins/cube/internals/resourcemetrics/host_sandbox_sampler.go \
            Cubelet/plugins/cube/internals/resourcemetrics/prometheus.go \
            NolaneWorld/substrate/cube/host_resource.go
          git commit -m "feat(v15): propagate exact host OOM provenance" -m "Autonomously-by: ChatGPT:GPT-5.6-Sol"
          git push origin HEAD:wave15-cube-oom-provenance

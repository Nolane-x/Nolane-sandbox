name: Wave 22 Public Live Verdict Contract

on:
  pull_request:
    paths:
      - 'NolaneWorld/gauntlet/live/resourceproof/**'
      - 'tests/wave22_public_live_verdict_contract.py'
      - 'docs/superpowers/specs/**public-live-verdict-authority-v22**'
      - 'docs/superpowers/plans/**public-live-verdict-authority-v22**'
      - '.github/workflows/wave22-public-live-verdict-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave22-public-live-verdict-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trust-shape:
    name: Static trust shape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify authority boundary
        run: python3 tests/wave22_public_live_verdict_contract.py

  resourceproof:
    name: Resource verdict behavior
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: NolaneWorld/go.mod
      - name: Wave 22 focused tests
        working-directory: NolaneWorld
        run: go test ./gauntlet/live/resourceproof -run 'V22|Wave22' -count=1
      - name: Full resourceproof suite
        working-directory: NolaneWorld
        run: go test ./gauntlet/live/resourceproof -count=1
      - name: Resourceproof vet
        working-directory: NolaneWorld
        run: go vet ./gauntlet/live/resourceproof

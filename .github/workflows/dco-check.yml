name: DCO Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dco-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    # Keep the historical check name for required-status compatibility.
    # Human DCO is optional; AI provenance is mandatory for AI-authored commits.
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check contribution provenance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          failed=0
          while IFS= read -r sha; do
            # Merge commits are repository integration records rather than
            # contribution commits and do not need an attribution trailer.
            parents=$(git cat-file -p "$sha" | grep -c '^parent ' || true)
            if [[ "$parents" -gt 1 ]]; then
              continue
            fi

            message=$(git log -1 --format='%B' "$sha")

            # Human DCO remains accepted but is no longer mandatory.
            if echo "$message" | grep -qP '^Signed-off-by: .+ <.+@.+>' ; then
              continue
            fi

            # AI-generated work must remain explicitly attributable.
            if echo "$message" | grep -qP '^(Assisted-by|Autonomously-by): [^:[:space:]]+:.+' ; then
              continue
            fi

            echo "::error::Commit $sha is missing contribution provenance."
            echo "  Subject: $(git log -1 --format='%s' "$sha")"
            echo "  Author:  $(git log -1 --format='%an <%ae>' "$sha")"
            echo ""
            echo "Accepted trailers:"
            echo "  Signed-off-by: Name <email>                 # optional human DCO"
            echo "  Assisted-by: AGENT_NAME:MODEL_VERSION       # AI-assisted"
            echo "  Autonomously-by: AGENT_NAME:MODEL_VERSION  # AI-authored"
            echo ""
            failed=1
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")

          if [[ "$failed" -eq 1 ]]; then
            exit 1
          fi

          echo "All contribution commits have accepted provenance. Human DCO is optional."

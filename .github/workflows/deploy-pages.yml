name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Build/validation needs only read access. Deployment authority is granted
# narrowly to the deploy job below, after Pages availability is established.
permissions:
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Check Pages availability
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/pages.json"
          status="$(curl --silent --show-error \
            --output "${response}" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/pages")"

          case "${status}" in
            200)
              echo 'enabled=true' >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo 'enabled=false' >> "${GITHUB_OUTPUT}"
              echo "::notice::GitHub Pages is not enabled for ${REPOSITORY}; docs will still be built and deployment will be skipped."
              ;;
            *)
              echo "::error::Unable to determine GitHub Pages status (HTTP ${status})."
              cat "${response}" || true
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build with VitePress
        run: npm run docs:build
        working-directory: docs

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages-enabled == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Wave21 Apply Agent Wiring Once
on:
  push:
    branches: [gpt/wave21-guest-kernel-oom-victim-provenance]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/wave21-guest-kernel-oom-victim-provenance
          fetch-depth: 0
      - name: Apply exact Wave21 guest production wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); text=p.read_text(); n=text.count(old)
              if n != 1: raise SystemExit(f"{path}: expected one anchor, got {n}: {old[:120]!r}")
              p.write_text(text.replace(old,new,1))

          p="agent/src/main.rs"
          if "mod guest_oom_victim;" not in Path(p).read_text():
              r(p,"mod fixes;\nmod linux_abi;","mod fixes;\nmod guest_oom_victim;\nmod linux_abi;")

          p="agent/src/guest_oom_victim.rs"
          text=Path(p).read_text()
          if "pub fn current_boottime_ns" not in text:
              r(p,"use std::collections::HashMap;","use std::collections::HashMap;\nuse std::fs;")
              r(p,"#[derive(Default)]\npub struct GuestVictimStore", "#[derive(Debug, Default)]\npub struct GuestVictimStore")
              r(p,"fn canonical_boot_id(value: &str) -> bool {","pub fn current_boottime_ns() -> Result<u64, String> {\n    let mut ts = libc::timespec { tv_sec: 0, tv_nsec: 0 };\n    let rc = unsafe { libc::clock_gettime(libc::CLOCK_BOOTTIME, &mut ts) };\n    if rc != 0 { return Err(format!(\"clock_gettime(CLOCK_BOOTTIME) failed: {}\", std::io::Error::last_os_error())); }\n    if ts.tv_sec < 0 || ts.tv_nsec < 0 { return Err(\"CLOCK_BOOTTIME returned a negative value\".to_string()); }\n    let sec = u64::try_from(ts.tv_sec).map_err(|_| \"CLOCK_BOOTTIME seconds overflow\".to_string())?;\n    let nsec = u64::try_from(ts.tv_nsec).map_err(|_| \"CLOCK_BOOTTIME nanoseconds overflow\".to_string())?;\n    sec.checked_mul(1_000_000_000).and_then(|v| v.checked_add(nsec)).ok_or_else(|| \"CLOCK_BOOTTIME nanoseconds overflow\".to_string())\n}\n\npub fn read_guest_boot_id() -> Result<String, String> {\n    let value = fs::read_to_string(\"/proc/sys/kernel/random/boot_id\").map_err(|e| format!(\"read guest boot id failed: {}\", e))?;\n    let value = value.trim().to_string();\n    if !canonical_boot_id(&value) { return Err(\"guest boot id is not canonical\".to_string()); }\n    Ok(value)\n}\n\npub fn read_process_identity(pid: i32) -> Result<GuestProcessIdentity, String> {\n    if pid <= 0 { return Err(\"guest process pid must be positive\".to_string()); }\n    let stat = fs::read_to_string(format!(\"/proc/{}/stat\", pid)).map_err(|e| format!(\"read guest process stat failed: {}\", e))?;\n    let close = stat.rfind(')').ok_or_else(|| \"guest process stat is missing comm terminator\".to_string())?;\n    let tail = stat.get(close + 1..).ok_or_else(|| \"guest process stat tail is missing\".to_string())?;\n    let fields: Vec<&str> = tail.split_whitespace().collect();\n    if fields.len() <= 19 { return Err(\"guest process stat is missing field 22\".to_string()); }\n    let starttime_ticks = fields[19].parse::<u64>().map_err(|_| \"guest process starttime is invalid\".to_string())?;\n    if starttime_ticks == 0 { return Err(\"guest process starttime must be non-zero\".to_string()); }\n    Ok(GuestProcessIdentity { tgid: u32::try_from(pid).map_err(|_| \"guest process pid overflow\".to_string())?, starttime_ticks })\n}\n\nfn canonical_boot_id(value: &str) -> bool {")

          p="agent/src/sandbox.rs"
          if "guest_oom_victim: GuestVictimStore" not in Path(p).read_text():
              r(p,"use crate::linux_abi::*;","use crate::guest_oom_victim::{FinalizedEvidence, GuestProcessIdentity, GuestVictimStore, RawVictimEvent, RealizationToken};\nuse crate::linux_abi::*;")
              r(p,"    pub bind_watcher: BindWatcher,\n    pub pcimap: HashMap<pci::Address, pci::Address>,","    pub bind_watcher: BindWatcher,\n    guest_oom_victim: GuestVictimStore,\n    guest_oom_victim_loss_epoch: u64,\n    guest_oom_victim_active: HashMap<String, RealizationToken>,\n    pub pcimap: HashMap<pci::Address, pci::Address>,")
              r(p,"            bind_watcher: BindWatcher::new(),\n            pcimap: HashMap::new(),","            bind_watcher: BindWatcher::new(),\n            guest_oom_victim: GuestVictimStore::default(),\n            guest_oom_victim_loss_epoch: 0,\n            guest_oom_victim_active: HashMap::new(),\n            pcimap: HashMap::new(),")
              r(p,"    #[instrument]\n    pub async fn run_oom_event_monitor(&self, mut rx: Receiver<String>, container_id: String) {","    pub fn begin_guest_oom_victim_realization(\n        &mut self, container_id: &str, token: RealizationToken, started_boot_ns: u64, guest_boot_id: &str, main: GuestProcessIdentity, expected_cgroup_v2_id: Option<u64>,\n    ) -> Result<()> {\n        self.guest_oom_victim_active.remove(container_id);\n        self.guest_oom_victim.begin(token, started_boot_ns, guest_boot_id, main, expected_cgroup_v2_id, self.guest_oom_victim_loss_epoch).map_err(|e| anyhow!(e))?;\n        self.guest_oom_victim_active.insert(container_id.to_string(), token);\n        Ok(())\n    }\n\n    pub fn record_guest_oom_victim_raw(&mut self, event: RawVictimEvent) -> Result<()> {\n        self.guest_oom_victim.record_raw(event).map_err(|e| anyhow!(e))\n    }\n\n    pub fn finalize_guest_oom_victim_realization(&mut self, container_id: &str, outcome_observed_boot_ns: u64) -> Result<Option<FinalizedEvidence>> {\n        let Some(token) = self.guest_oom_victim_active.remove(container_id) else { return Ok(None); };\n        self.guest_oom_victim.finalize(token, outcome_observed_boot_ns, self.guest_oom_victim_loss_epoch).map_err(|e| anyhow!(e))\n    }\n\n    pub fn get_guest_oom_victim_evidence(&self, token: &RealizationToken) -> Option<FinalizedEvidence> {\n        self.guest_oom_victim.finalized(token)\n    }\n\n    pub fn clear_guest_oom_victim_realization(&mut self, container_id: &str) {\n        self.guest_oom_victim_active.remove(container_id);\n    }\n\n    #[instrument]\n    pub async fn run_oom_event_monitor(&self, mut rx: Receiver<String>, container_id: String) {")

          p="agent/src/rpc.rs"
          if "async fn get_oom_victim_evidence" not in Path(p).read_text():
              r(p,"    GuestDetailsResponse, Interfaces, Metrics, OOMEvent, ReadStreamResponse, Routes,\n    SetIPTablesRequest, SetIPTablesResponse, StatsContainerResponse, VolumeStatsRequest,\n    WaitProcessResponse, WriteStreamResponse,","    GetOOMVictimEvidenceResponse, GuestDetailsResponse, Interfaces, Metrics, OOMEvent,\n    OOMVictimProof, OOMVictimScope, ReadStreamResponse, Routes, SetIPTablesRequest,\n    SetIPTablesResponse, StatsContainerResponse, VolumeStatsRequest, WaitProcessResponse,\n    WriteStreamResponse,")
              r(p,"use crate::linux_abi::*;","use crate::guest_oom_victim::{current_boottime_ns, read_guest_boot_id, read_process_identity, RealizationToken, VictimClass};\nuse crate::linux_abi::*;")
              old='''    #[instrument]\n    async fn do_start_container(&self, req: protocols::agent::StartContainerRequest) -> Result<()> {\n        let cid = req.container_id;\n\n        let sandbox = self.sandbox.clone();\n        let mut s = sandbox.lock().await;\n        let sid = s.id.clone();\n\n        let ctr = s\n            .get_container(&cid)\n            .ok_or_else(|| anyhow!("Invalid container id"))?;\n\n        ctr.exec().await?;\n\n        if sid == cid {\n            return Ok(());\n        }\n\n        // start oom event loop\n        if let Some(ref ctr) = ctr.cgroup_manager {\n            let cg_path = ctr.get_cg_path("memory");\n\n            if let Some(cg_path) = cg_path {\n                let rx = notifier::notify_oom(cid.as_str(), cg_path.to_string()).await?;\n\n                s.run_oom_event_monitor(rx, cid.clone()).await;\n            }\n        }\n\n        Ok(())\n    }'''
              new='''    #[instrument]\n    async fn do_start_container(&self, req: protocols::agent::StartContainerRequest) -> Result<()> {\n        let cid = req.container_id;\n        let token = if req.oom_victim_realization_token.is_empty() {\n            None\n        } else if req.oom_victim_realization_token.len() != 32 {\n            warn!(sl!(), "Wave21 realization token has invalid length for {}", cid);\n            None\n        } else {\n            let mut raw = [0u8; 32];\n            raw.copy_from_slice(req.oom_victim_realization_token.as_slice());\n            match RealizationToken::from_bytes(raw) {\n                Ok(token) => Some(token),\n                Err(e) => { warn!(sl!(), "Wave21 realization token is invalid for {}: {}", cid, e); None }\n            }\n        };\n        let started = token.and_then(|token| match current_boottime_ns() {\n            Ok(ts) => Some((token, ts)),\n            Err(e) => { warn!(sl!(), "Wave21 start clock unavailable for {}: {}", cid, e); None }\n        });\n\n        let sandbox = self.sandbox.clone();\n        let mut s = sandbox.lock().await;\n        let sid = s.id.clone();\n        if token.is_none() { s.clear_guest_oom_victim_realization(&cid); }\n\n        let (init_pid, cg_path) = {\n            let ctr = s.get_container(&cid).ok_or_else(|| anyhow!("Invalid container id"))?;\n            ctr.exec().await?;\n            let init_pid = ctr.init_process_pid;\n            let cg_path = ctr.cgroup_manager.as_ref().and_then(|manager| manager.get_cg_path("memory"));\n            (init_pid, cg_path)\n        };\n\n        if sid == cid { return Ok(()); }\n\n        if let Some((token, started_boot_ns)) = started {\n            match (read_guest_boot_id(), read_process_identity(init_pid)) {\n                (Ok(boot_id), Ok(main)) => {\n                    if let Err(e) = s.begin_guest_oom_victim_realization(&cid, token, started_boot_ns, &boot_id, main, None) {\n                        warn!(sl!(), "Wave21 realization unavailable for {}: {}", cid, e);\n                    }\n                }\n                (boot, main) => warn!(sl!(), "Wave21 identity unavailable for {}: boot={:?} main={:?}", cid, boot.err(), main.err()),\n            }\n        }\n\n        // Compatibility OOM notification remains independent from Wave21 victim authority.\n        if let Some(cg_path) = cg_path {\n            let rx = notifier::notify_oom(cid.as_str(), cg_path.to_string()).await?;\n            s.run_oom_event_monitor(rx, cid.clone()).await;\n        }\n        Ok(())\n    }'''
              r(p,old,new)
              r(p,"        let cid = req.container_id.clone();\n        let eid = req.exec_id;\n        let s = self.sandbox.clone();","        let cid = req.container_id.clone();\n        let eid = req.exec_id;\n        let is_main = eid.is_empty();\n        let s = self.sandbox.clone();")
              r(p,"                return Ok(resp);\n            }\n        };","                if is_main {\n                    match current_boottime_ns() {\n                        Ok(ts) => { if let Err(e) = sandbox.finalize_guest_oom_victim_realization(&cid, ts) { warn!(sl!(), \"Wave21 finalize unavailable for {}: {}\", cid, e); } },\n                        Err(e) => warn!(sl!(), \"Wave21 outcome clock unavailable for {}: {}\", cid, e),\n                    }\n                }\n                return Ok(resp);\n            }\n        };")
              r(p,"        ctr.processes.remove(&pid);\n        let remove_ms = remove_start.elapsed().as_millis();","        ctr.processes.remove(&pid);\n        let remove_ms = remove_start.elapsed().as_millis();\n        if is_main {\n            match current_boottime_ns() {\n                Ok(ts) => { if let Err(e) = sandbox.finalize_guest_oom_victim_realization(&cid, ts) { warn!(sl!(), \"Wave21 finalize unavailable for {}: {}\", cid, e); } },\n                Err(e) => warn!(sl!(), \"Wave21 outcome clock unavailable for {}: {}\", cid, e),\n            }\n        }")
              r(p,"        let cid = req.container_id.clone();\n        let mut cmounts: Vec<String> = vec![];","        let cid = req.container_id.clone();\n        self.sandbox.lock().await.clear_guest_oom_victim_realization(&cid);\n        let mut cmounts: Vec<String> = vec![];")
              r(p,"    async fn get_volume_stats(\n        &self,","    async fn get_oom_victim_evidence(\n        &self,\n        _ctx: &TtrpcContext,\n        req: protocols::agent::GetOOMVictimEvidenceRequest,\n    ) -> ttrpc::Result<GetOOMVictimEvidenceResponse> {\n        is_allowed!(req);\n        if req.container_id.is_empty() || req.realization_token.len() != 32 {\n            return Err(ttrpc_error!(ttrpc::Code::INVALID_ARGUMENT, \"Wave21 exact container id and 32-byte realization token are required\"));\n        }\n        let mut raw = [0u8; 32];\n        raw.copy_from_slice(req.realization_token.as_slice());\n        let token = RealizationToken::from_bytes(raw).map_err(|e| ttrpc_error!(ttrpc::Code::INVALID_ARGUMENT, e))?;\n        let evidence = self.sandbox.lock().await.get_guest_oom_victim_evidence(&token).ok_or_else(|| ttrpc_error!(ttrpc::Code::NOT_FOUND, \"Wave21 finalized evidence unavailable\"))?;\n        if evidence.poisoned { return Err(ttrpc_error!(ttrpc::Code::FAILED_PRECONDITION, \"Wave21 finalized evidence is poisoned\")); }\n        let mut resp = GetOOMVictimEvidenceResponse::new();\n        resp.guest_boot_id = evidence.guest_boot_id;\n        for victim in evidence.victims {\n            let mut proof = OOMVictimProof::new();\n            proof.victim_tid = victim.tid; proof.victim_tgid = victim.tgid; proof.victim_starttime_ticks = victim.starttime_ticks; proof.event_boot_time_ns = victim.event_boot_ns; proof.cgroup_v2_id = victim.cgroup_v2_id.unwrap_or(0);\n            proof.scope = match victim.class { VictimClass::Main => OOMVictimScope::OOM_VICTIM_SCOPE_MAIN, VictimClass::Member => OOMVictimScope::OOM_VICTIM_SCOPE_MEMBER }.into();\n            resp.proofs.push(proof);\n        }\n        Ok(resp)\n    }\n\n    async fn get_volume_stats(\n        &self,")
          print("Wave21 agent wiring applied")
          PY
          cargo fmt --manifest-path agent/Cargo.toml --all
          git diff --check
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/src/main.rs agent/src/guest_oom_victim.rs agent/src/sandbox.rs agent/src/rpc.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(v21): wire finalized guest victim authority into agent" -m "Autonomously-by: ChatGPT:GPT-5.6-Sol"
          git push origin HEAD:gpt/wave21-guest-kernel-oom-victim-provenance
